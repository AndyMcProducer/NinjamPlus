name: Release

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
      - "V*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0)"
        required: true
        type: string
      prerelease:
        description: "Mark as pre-release"
        required: false
        default: false
        type: boolean

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write

concurrency:
  group: ninjamplus-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    name: Functional tests
    if: github.repository == 'steveseguin/NinjamPlus' || github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test embedded helper
        run: npm test

  windows:
    name: Windows (Standalone, VST3)
    if: github.repository == 'steveseguin/NinjamPlus' || github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    needs: tests
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_type == 'tag' && github.ref_name || format('v0.9.{0}.{1}', github.run_number, github.run_attempt) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Detect project root
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $rootCmake = Join-Path $PWD "CMakeLists.txt"
          if ((Test-Path $rootCmake) -and (Select-String -Path $rootCmake -Pattern 'project\s*\(\s*NINJAM_VST3\b' -Quiet)) {
            $cmakeFile = Get-Item $rootCmake
          } else {
            $cmakeFile = Get-ChildItem -Path . -Recurse -File -Filter CMakeLists.txt | Where-Object {
              Select-String -Path $_.FullName -Pattern 'project\s*\(\s*NINJAM_VST3\b' -Quiet
            } | Select-Object -First 1
          }
          if ($null -eq $cmakeFile) {
            throw "Could not find CMakeLists.txt for NINJAM_VST3"
          }
          $srcDir = [System.IO.Path]::GetRelativePath($PWD.Path, $cmakeFile.DirectoryName)
          if ([string]::IsNullOrWhiteSpace($srcDir)) { $srcDir = "." }
          $srcDir = $srcDir -replace "\\", "/"
          "SRC_DIR=$srcDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Using SRC_DIR=$srcDir"

      - name: Detect Visual Studio CMake generator
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            throw "vswhere.exe not found at $vswhere"
          }

          $installationVersion = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationVersion
          if ([string]::IsNullOrWhiteSpace($installationVersion)) {
            throw "Could not detect a Visual Studio installation with C++ tools"
          }

          $majorVersion = [int]($installationVersion.Split('.')[0])
          switch ($majorVersion) {
            18 { $generator = "Visual Studio 18 2026" }
            17 { $generator = "Visual Studio 17 2022" }
            default { throw "Unsupported Visual Studio major version: $installationVersion" }
          }

          "WIN_CMAKE_GENERATOR=$generator" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Using Windows CMake generator $generator"

      - name: Configure
        run: >
          cmake -S $env:SRC_DIR -B build -G "$env:WIN_CMAKE_GENERATOR" -A x64

      - name: Build
        run: >
          cmake --build build --config Release
          --target NINJAM_VST3_Standalone NINJAM_VST3_VST3

      - name: Validate VST3 with pluginval
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zip = Join-Path $env:RUNNER_TEMP "pluginval_Windows.zip"
          $dir = Join-Path $env:RUNNER_TEMP "pluginval"
          Invoke-WebRequest -Uri "https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip" -OutFile $zip
          $expectedHash = "C08E61CE3B96DB41636F8EC7E76F4C7E2C13EBDAC7FA1B5A1F52B4F32EC715AB"
          $actualHash = (Get-FileHash -Path $zip -Algorithm SHA256).Hash
          if ($actualHash -ne $expectedHash) { throw "pluginval checksum mismatch: $actualHash" }
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          $plugin = Resolve-Path "build\NINJAMplus\Release\VST3\NINJAMplus.vst3"
          New-Item -ItemType Directory -Path "pluginval-logs" -Force | Out-Null
          & (Join-Path $dir "pluginval.exe") --strictness-level 5 --random-seed 0x4e494e4a --timeout-ms 60000 --skip-gui-tests --output-dir "pluginval-logs" --output-filename "NINJAMplus-pluginval.txt" --verbose $plugin.Path 2>&1 | Tee-Object -FilePath "pluginval-logs\pluginval-console.txt"
          $pluginvalExitCode = $LASTEXITCODE
          if ($pluginvalExitCode -ne 0) { throw "pluginval failed with exit code $pluginvalExitCode" }

      - name: Upload pluginval log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pluginval-release-windows
          path: pluginval-logs
          if-no-files-found: warn

      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path out | Out-Null

          $srcRoot = Join-Path $PWD $env:SRC_DIR
          $noticeFiles = @("LEGAL_NOTICES.txt", "THIRD_PARTY_NOTICES.md")

          $artefacts = Join-Path $PWD "build\NINJAMplus\Release"
          $standaloneDir = Join-Path $artefacts "Standalone"
          $vst3Dir = Join-Path $artefacts "VST3"

          if (Test-Path $standaloneDir) {
            $texturesSrc = Join-Path $srcRoot "textures"
            if (Test-Path $texturesSrc) {
              $texturesDst = Join-Path $standaloneDir "textures"
              if (Test-Path $texturesDst) { Remove-Item -Recurse -Force $texturesDst }
              Copy-Item -Recurse -Force $texturesSrc $texturesDst
            }
            foreach ($noticeName in $noticeFiles) {
              $noticeSrc = Join-Path $srcRoot $noticeName
              if (Test-Path $noticeSrc) {
                Copy-Item -Force $noticeSrc (Join-Path $standaloneDir $noticeName)
              }
            }
            $vdoSrc = Join-Path $srcRoot "advanced-vdo-client"
            if (Test-Path $vdoSrc) {
              $vdoDst = Join-Path $standaloneDir "advanced-vdo-client"
              if (Test-Path $vdoDst) { Remove-Item -Recurse -Force $vdoDst }
              Copy-Item -Recurse -Force $vdoSrc $vdoDst
            }
            Compress-Archive -Force -Path (Join-Path $standaloneDir "*") -DestinationPath "out\NINJAMplus-windows-standalone.zip"
          } else {
            throw "Standalone artefacts not found at $standaloneDir"
          }

          if (Test-Path $vst3Dir) {
            $bundleDir = Get-ChildItem -Path $vst3Dir -Directory -Filter "*.vst3" | Select-Object -First 1
            if ($null -ne $bundleDir) {
              $resourcesDir = Join-Path $bundleDir.FullName "Contents\\Resources"
              New-Item -ItemType Directory -Force -Path $resourcesDir | Out-Null

              $texturesSrc = Join-Path $srcRoot "textures"
              if (Test-Path $texturesSrc) {
                $texturesDst = Join-Path $resourcesDir "textures"
                if (Test-Path $texturesDst) { Remove-Item -Recurse -Force $texturesDst }
                Copy-Item -Recurse -Force $texturesSrc $texturesDst
              }
              foreach ($noticeName in $noticeFiles) {
                $noticeSrc = Join-Path $srcRoot $noticeName
                if (Test-Path $noticeSrc) {
                  Copy-Item -Force $noticeSrc (Join-Path $resourcesDir $noticeName)
                }
              }

              $vdoSrc = Join-Path $srcRoot "advanced-vdo-client"
              if (Test-Path $vdoSrc) {
                $vdoDst = Join-Path $resourcesDir "advanced-vdo-client"
                if (Test-Path $vdoDst) { Remove-Item -Recurse -Force $vdoDst }
                Copy-Item -Recurse -Force $vdoSrc $vdoDst
              }
            }

            Compress-Archive -Force -Path (Join-Path $vst3Dir "*") -DestinationPath "out\NINJAMplus-windows-vst3.zip"
          } else {
            throw "VST3 artefacts not found at $vst3Dir"
          }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          choco install innosetup -y

      - name: Build installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (-not (Test-Path "LEGAL_NOTICES.txt")) {
            throw "LEGAL_NOTICES.txt not found in repository root"
          }
          $tag = $env:RELEASE_TAG
          if ([string]::IsNullOrWhiteSpace($tag)) { $tag = "v0.0.0" }
          $version = $tag
          if ($version -match '^[vV]') { $version = $version.Substring(1) }

          $artefacts = Join-Path $PWD "build\NINJAMplus\Release"
          $standaloneDir = Join-Path $artefacts "Standalone"
          $vst3Dir = Join-Path $artefacts "VST3"

          $exe = Get-ChildItem -Path $standaloneDir -File -Filter "*.exe" | Select-Object -First 1
          if ($null -eq $exe) { throw "Standalone exe not found in $standaloneDir" }

          $vst3Bundle = Get-ChildItem -Path $vst3Dir -Directory -Filter "*.vst3" | Select-Object -First 1
          if ($null -eq $vst3Bundle) { throw "VST3 bundle not found in $vst3Dir" }

          $issLines = @(
            '[Setup]'
            'AppName=NINJAMplus'
            "AppVersion=$version"
            'DefaultDirName={autopf}\NINJAMplus'
            'DefaultGroupName=NINJAMplus'
            'Compression=lzma2'
            'SolidCompression=yes'
            'ArchitecturesInstallIn64BitMode=x64'
            'OutputDir=out'
            'OutputBaseFilename=NINJAMplus-Setup-Windows'
            'DisableProgramGroupPage=yes'
            'InfoBeforeFile=LEGAL_NOTICES.txt'
            ''
            '[Files]'
            "Source: ""$($exe.FullName)""; DestDir: ""{app}""; Flags: ignoreversion"
            "Source: ""$standaloneDir\*""; DestDir: ""{app}""; Flags: ignoreversion recursesubdirs createallsubdirs"
            "Source: ""$($vst3Bundle.FullName)\*""; DestDir: ""{commoncf}\VST3\$($vst3Bundle.Name)""; Flags: ignoreversion recursesubdirs createallsubdirs"
            ''
            '[Icons]'
            "Name: ""{autoprograms}\NINJAMplus""; Filename: ""{app}\$($exe.Name)"""
            ''
            '[Run]'
            "Filename: ""{app}\$($exe.Name)""; Description: ""Launch NINJAMplus""; Flags: postinstall nowait skipifsilent"
          )
          $iss = ($issLines -join "`r`n") + "`r`n"

          Set-Content -Path "installer.iss" -Value $iss -Encoding UTF8
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "installer.iss"

      - name: Upload
        uses: actions/upload-artifact@v6
        with:
          name: windows-release
          path: out/*

  linux:
    name: Linux (Standalone, VST3, LV2)
    if: github.repository == 'steveseguin/NinjamPlus' || github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    needs: tests
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_type == 'tag' && github.ref_name || format('v0.9.{0}.{1}', github.run_number, github.run_attempt) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            libasound2-dev \
            libfreetype6-dev \
            libfontconfig1-dev \
            libx11-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxext-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxrender-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libx11-xcb-dev \
            libxfixes-dev

      - name: Detect project root
        shell: bash
        run: |
          set -euo pipefail
          if [ -f ./CMakeLists.txt ] && grep -Eq 'project[[:space:]]*\([[:space:]]*NINJAM_VST3\b' ./CMakeLists.txt; then
            CMAKE_FILE="./CMakeLists.txt"
          else
            CMAKE_FILE="$(
              find . -name CMakeLists.txt -type f -print0 | while IFS= read -r -d '' f; do
                if grep -Eq 'project[[:space:]]*\([[:space:]]*NINJAM_VST3\b' "$f"; then
                  echo "$f"
                  break
                fi
              done
            )"
          fi
          if [ -z "${CMAKE_FILE}" ]; then
            echo "Could not find CMakeLists.txt for NINJAM_VST3"
            exit 1
          fi
          SRC_DIR="$(dirname "${CMAKE_FILE}")"
          SRC_DIR="${SRC_DIR#./}"
          if [ -z "${SRC_DIR}" ]; then SRC_DIR="."; fi
          echo "SRC_DIR=${SRC_DIR}" >> "$GITHUB_ENV"
          echo "Using SRC_DIR=${SRC_DIR}"

      - name: Configure
        run: cmake -S "${SRC_DIR}" -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: >
          cmake --build build
          --target NINJAM_VST3_All

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out

          ARTEFACTS="build/NINJAMplus/Release"
          STANDALONE_DIR="${ARTEFACTS}/Standalone"
          VST3_DIR="${ARTEFACTS}/VST3"
          LV2_DIR="${ARTEFACTS}/LV2"
          SRC_ROOT="${SRC_DIR}"
          NOTICE_FILES=("LEGAL_NOTICES.txt" "THIRD_PARTY_NOTICES.md")

          copy_notice_files() {
            local dest_dir="$1"
            mkdir -p "${dest_dir}"
            for notice in "${NOTICE_FILES[@]}"; do
              if [ -f "${SRC_ROOT}/${notice}" ]; then
                cp -f "${SRC_ROOT}/${notice}" "${dest_dir}/"
              fi
            done
          }

          copy_helper_dir() {
            local dest_dir="$1"
            mkdir -p "${dest_dir}"
            rm -rf "${dest_dir}/advanced-vdo-client" "${dest_dir}/textures" || true
            cp -R "${SRC_ROOT}/advanced-vdo-client" "${dest_dir}/advanced-vdo-client"
            cp -R "${SRC_ROOT}/textures" "${dest_dir}/textures"
            copy_notice_files "${dest_dir}"
          }

          if [ -d "${STANDALONE_DIR}" ]; then
            copy_helper_dir "${STANDALONE_DIR}"
            tar -C "${STANDALONE_DIR}" -czf "out/NINJAMplus-linux-standalone.tar.gz" .
          else
            echo "Standalone artefacts not found at ${STANDALONE_DIR}"
            exit 1
          fi

          if [ -d "${VST3_DIR}" ]; then
            VST3_PATH="$(find "${VST3_DIR}" -maxdepth 1 -name "*.vst3" -print -quit)"
            if [ -z "${VST3_PATH}" ]; then
              echo "No .vst3 found in ${VST3_DIR}"
              exit 1
            fi
            copy_helper_dir "${VST3_PATH}"
            tar -C "${VST3_DIR}" -czf "out/NINJAMplus-linux-vst3.tar.gz" "$(basename "${VST3_PATH}")"
          else
            echo "VST3 artefacts not found at ${VST3_DIR}"
            exit 1
          fi

          if [ -d "${LV2_DIR}" ]; then
            LV2_PATH="$(find "${LV2_DIR}" -maxdepth 1 -name "*.lv2" -print -quit)"
            if [ -z "${LV2_PATH}" ]; then
              echo "No .lv2 found in ${LV2_DIR}"
              exit 1
            fi
            copy_helper_dir "${LV2_PATH}"
            tar -C "${LV2_DIR}" -czf "out/NINJAMplus-linux-lv2.tar.gz" "$(basename "${LV2_PATH}")"
          else
            echo "LV2 artefacts not found at ${LV2_DIR}"
            exit 1
          fi

      - name: Upload
        uses: actions/upload-artifact@v6
        with:
          name: linux-release
          path: out/*

  mac:
    name: macOS (Standalone, AU, VST3)
    if: github.repository == 'steveseguin/NinjamPlus' || github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    needs: tests
    runs-on: macos-14
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_type == 'tag' && github.ref_name || format('v0.9.{0}.{1}', github.run_number, github.run_attempt) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Import Apple Developer ID certificates
        shell: bash
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          REQUIRE_SIGNING: ${{ (github.repository == 'steveseguin/NinjamPlus' || github.repository == 'AndyMcProducer/NinjamPlus') && '1' || '0' }}
        run: |
          set -euo pipefail
          if [ -z "${MACOS_CERTIFICATE:-}" ] || [ -z "${MACOS_CERTIFICATE_PASSWORD:-}" ] || [ -z "${KEYCHAIN_PASSWORD:-}" ]; then
            if [ "${REQUIRE_SIGNING}" = "1" ]; then
              echo "macOS certificate secrets are required for release publishing"
              exit 1
            fi
            echo "macOS certificate secrets are not configured; using ad-hoc signing."
            exit 0
          fi

          CERTIFICATE_PATH="${RUNNER_TEMP}/developer-id.p12"
          KEYCHAIN_PATH="${RUNNER_TEMP}/ninjamplus-signing.keychain-db"
          printf '%s' "${MACOS_CERTIFICATE}" | base64 --decode > "${CERTIFICATE_PATH}"
          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security import "${CERTIFICATE_PATH}" -P "${MACOS_CERTIFICATE_PASSWORD}" -A -t cert -f pkcs12 -k "${KEYCHAIN_PATH}"
          security list-keychains -d user -s "${KEYCHAIN_PATH}" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security find-identity -v -p codesigning "${KEYCHAIN_PATH}"
          rm -f "${CERTIFICATE_PATH}"
          echo "MACOS_CERTIFICATE_IMPORTED=1" >> "${GITHUB_ENV}"

      - name: Detect project root
        shell: bash
        run: |
          set -euo pipefail
          if [ -f ./CMakeLists.txt ] && grep -Eq 'project[[:space:]]*\([[:space:]]*NINJAM_VST3\b' ./CMakeLists.txt; then
            CMAKE_FILE="./CMakeLists.txt"
          else
            CMAKE_FILE="$(
              find . -name CMakeLists.txt -type f -print0 | while IFS= read -r -d '' f; do
                if grep -Eq 'project[[:space:]]*\([[:space:]]*NINJAM_VST3\b' "$f"; then
                  echo "$f"
                  break
                fi
              done
            )"
          fi
          if [ -z "${CMAKE_FILE}" ]; then
            echo "Could not find CMakeLists.txt for NINJAM_VST3"
            exit 1
          fi
          SRC_DIR="$(dirname "${CMAKE_FILE}")"
          SRC_DIR="${SRC_DIR#./}"
          if [ -z "${SRC_DIR}" ]; then SRC_DIR="."; fi
          echo "SRC_DIR=${SRC_DIR}" >> "$GITHUB_ENV"
          echo "Using SRC_DIR=${SRC_DIR}"

      - name: Configure
        run: cmake -S "${SRC_DIR}" -B build -G Xcode

      - name: Build
        run: >
          cmake --build build --config Release
          --target NINJAM_VST3_Standalone NINJAM_VST3_AU NINJAM_VST3_VST3
          -- CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY=""

      - name: Validate universal binaries
        run: scripts/validate-macos-universal.sh build/NINJAMplus/Release

      - name: Package
        shell: bash
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          MACOS_INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          REQUIRE_SIGNING: ${{ (github.repository == 'steveseguin/NinjamPlus' || github.repository == 'AndyMcProducer/NinjamPlus') && '1' || '0' }}
        run: |
          set -euo pipefail
          mkdir -p out

          ARTEFACTS="build/NINJAMplus/Release"
          STANDALONE_DIR="${ARTEFACTS}/Standalone"
          AU_DIR="${ARTEFACTS}/AU"
          VST3_DIR="${ARTEFACTS}/VST3"
          NOTICE_FILES=("LEGAL_NOTICES.txt" "THIRD_PARTY_NOTICES.md")

          SIGN_ENABLED=0
          if [ "${MACOS_CERTIFICATE_IMPORTED:-0}" = "1" ] && [ -n "${MACOS_SIGN_IDENTITY:-}" ]; then
            SIGN_ENABLED=1
            echo "Using Developer ID Application signing."
          elif [ "${REQUIRE_SIGNING}" = "1" ]; then
            echo "MACOS_SIGN_IDENTITY and an imported certificate are required for release publishing"
            exit 1
          else
            echo "Using ad-hoc signing."
          fi

          NOTARY_ENABLED=0
          if [ "${SIGN_ENABLED}" -eq 1 ] && [ -n "${MACOS_INSTALLER_IDENTITY:-}" ] && [ -n "${APPLE_ID:-}" ] && [ -n "${APPLE_APP_SPECIFIC_PASSWORD:-}" ] && [ -n "${APPLE_TEAM_ID:-}" ]; then
            NOTARY_ENABLED=1
            echo "Notarization is enabled."
          elif [ "${REQUIRE_SIGNING}" = "1" ]; then
            echo "Installer signing and notarization secrets are required for release publishing"
            exit 1
          else
            echo "Notarization secrets are not configured; publishing an unsigned installer."
          fi

          sign_bundle() {
            local target="$1"
            xattr -cr "${target}" || true
            if [ "${SIGN_ENABLED}" -eq 1 ]; then
              codesign --force --deep --options runtime --timestamp --sign "${MACOS_SIGN_IDENTITY}" "${target}"
              codesign --verify --deep --strict --verbose=2 "${target}"
            else
              codesign --force --deep --sign - "${target}"
            fi
          }

          copy_notice_files() {
            local dest_dir="$1"
            mkdir -p "${dest_dir}"
            for notice in "${NOTICE_FILES[@]}"; do
              if [ -f "${SRC_DIR}/${notice}" ]; then
                cp -f "${SRC_DIR}/${notice}" "${dest_dir}/"
              fi
            done
          }

          if [ -d "${STANDALONE_DIR}" ]; then
            APP_PATH="$(find "${STANDALONE_DIR}" -maxdepth 1 -name "*.app" -print -quit)"
            if [ -z "${APP_PATH}" ]; then
              echo "No .app found in ${STANDALONE_DIR}"
              exit 1
            fi

            MACOS_DIR="${APP_PATH}/Contents/MacOS"
            RESOURCES_DIR="${APP_PATH}/Contents/Resources"
            copy_notice_files "${RESOURCES_DIR}"
            rm -rf "${MACOS_DIR}/textures" "${MACOS_DIR}/advanced-vdo-client" || true
            cp -R "${SRC_DIR}/textures" "${MACOS_DIR}/textures"
            cp -R "${SRC_DIR}/advanced-vdo-client" "${MACOS_DIR}/advanced-vdo-client"

            sign_bundle "${APP_PATH}"

            ditto -c -k --sequesterRsrc --keepParent "${APP_PATH}" "out/NINJAMplus-macos-standalone.zip"
          else
            echo "Standalone artefacts not found at ${STANDALONE_DIR}"
            exit 1
          fi

          if [ -d "${AU_DIR}" ]; then
            COMP_PATH="$(find "${AU_DIR}" -maxdepth 1 -name "*.component" -print -quit)"
            if [ -z "${COMP_PATH}" ]; then
              echo "No .component found in ${AU_DIR}"
              exit 1
            fi
            mkdir -p "${COMP_PATH}/Contents/Resources"
            copy_notice_files "${COMP_PATH}/Contents/Resources"
            rm -rf "${COMP_PATH}/Contents/Resources/textures" "${COMP_PATH}/Contents/Resources/advanced-vdo-client" || true
            cp -R "${SRC_DIR}/textures" "${COMP_PATH}/Contents/Resources/textures"
            cp -R "${SRC_DIR}/advanced-vdo-client" "${COMP_PATH}/Contents/Resources/advanced-vdo-client"

            sign_bundle "${COMP_PATH}"

            ditto -c -k --sequesterRsrc --keepParent "${COMP_PATH}" "out/NINJAMplus-macos-au.zip"
          else
            echo "AU artefacts not found at ${AU_DIR}"
            exit 1
          fi

          if [ -d "${VST3_DIR}" ]; then
            VST3_PATH="$(find "${VST3_DIR}" -maxdepth 1 -name "*.vst3" -print -quit)"
            if [ -z "${VST3_PATH}" ]; then
              echo "No .vst3 found in ${VST3_DIR}"
              exit 1
            fi
            mkdir -p "${VST3_PATH}/Contents/Resources"
            copy_notice_files "${VST3_PATH}/Contents/Resources"
            rm -rf "${VST3_PATH}/Contents/Resources/textures" "${VST3_PATH}/Contents/Resources/advanced-vdo-client" || true
            cp -R "${SRC_DIR}/textures" "${VST3_PATH}/Contents/Resources/textures"
            cp -R "${SRC_DIR}/advanced-vdo-client" "${VST3_PATH}/Contents/Resources/advanced-vdo-client"

            sign_bundle "${VST3_PATH}"

            ditto -c -k --sequesterRsrc --keepParent "${VST3_PATH}" "out/NINJAMplus-macos-vst3.zip"
          else
            echo "VST3 artefacts not found at ${VST3_DIR}"
            exit 1
          fi

          TAG="${RELEASE_TAG:-v0.0.0}"
          VERSION="${TAG#[vV]}"
          PKGROOT="pkgroot"
          PKG_SCRIPTS_DIR="${SRC_DIR}/scripts/macos/pkg"
          rm -rf "${PKGROOT}"
          mkdir -p "${PKGROOT}/Applications"
          mkdir -p "${PKGROOT}/Library/Audio/Plug-Ins/Components"
          mkdir -p "${PKGROOT}/Library/Audio/Plug-Ins/VST3"
          mkdir -p "${PKGROOT}/Library/Application Support/NINJAMplus"
          cp -R "${APP_PATH}" "${PKGROOT}/Applications/"
          cp -R "${COMP_PATH}" "${PKGROOT}/Library/Audio/Plug-Ins/Components/"
          cp -R "${VST3_PATH}" "${PKGROOT}/Library/Audio/Plug-Ins/VST3/"
          copy_notice_files "${PKGROOT}/Library/Application Support/NINJAMplus"
          if [ -f "${SRC_DIR}/scripts/macos/NINJAM-VDO-Fix.command" ]; then
            cp -f "${SRC_DIR}/scripts/macos/NINJAM-VDO-Fix.command" "${PKGROOT}/Library/Application Support/NINJAMplus/"
            chmod 755 "${PKGROOT}/Library/Application Support/NINJAMplus/NINJAM-VDO-Fix.command"
          fi

          PKGBUILD_ARGS=(
            --root "${PKGROOT}"
            --install-location "/"
            --scripts "${PKG_SCRIPTS_DIR}"
            --identifier "com.amp.ninjamplus"
            --version "${VERSION}"
          )
          pkgbuild "${PKGBUILD_ARGS[@]}" "out/NINJAMplus-macOS-unsigned.pkg"
          if [ "${SIGN_ENABLED}" -eq 1 ] && [ -n "${MACOS_INSTALLER_IDENTITY:-}" ]; then
            productsign --sign "${MACOS_INSTALLER_IDENTITY}" "out/NINJAMplus-macOS-unsigned.pkg" "out/NINJAMplus-macOS.pkg"
            rm -f "out/NINJAMplus-macOS-unsigned.pkg"
            pkgutil --check-signature "out/NINJAMplus-macOS.pkg"
          else
            mv "out/NINJAMplus-macOS-unsigned.pkg" "out/NINJAMplus-macOS.pkg"
          fi

          if [ "${NOTARY_ENABLED}" -eq 1 ]; then
            xcrun notarytool submit "out/NINJAMplus-macOS.pkg" \
              --apple-id "${APPLE_ID}" \
              --password "${APPLE_APP_SPECIFIC_PASSWORD}" \
              --team-id "${APPLE_TEAM_ID}" \
              --wait
            xcrun stapler staple "out/NINJAMplus-macOS.pkg"
          fi

      - name: Remove signing keychain
        if: always()
        shell: bash
        run: |
          security delete-keychain "${RUNNER_TEMP}/ninjamplus-signing.keychain-db" 2>/dev/null || true
          rm -f "${RUNNER_TEMP}/developer-id.p12"

      - name: Upload
        uses: actions/upload-artifact@v6
        with:
          name: macos-release
          path: out/*

  release:
    name: Publish GitHub Release
    if: github.repository == 'steveseguin/NinjamPlus' || github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: [windows, linux, mac]
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v5
        with:
          name: windows-release
          path: out

      - name: Download Linux artifacts
        uses: actions/download-artifact@v5
        with:
          name: linux-release
          path: out

      - name: Download macOS artifacts
        uses: actions/download-artifact@v5
        with:
          name: macos-release
          path: out

      - name: Generate SHA-256 checksums
        working-directory: out
        run: sha256sum * > SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_type == 'tag' && github.ref_name || format('build-{0}-{1}', github.run_number, github.run_attempt) }}
          name: "${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_type == 'tag' && github.ref_name || format('Automatic build #{0} from {1}', github.run_number, github.ref_name) }}"
          target_commitish: ${{ github.sha }}
          prerelease: ${{ (github.event_name == 'workflow_dispatch' && inputs.prerelease) || (github.event_name != 'workflow_dispatch' && (github.ref_type != 'tag' || contains(github.ref_name, '-'))) }}
          make_latest: ${{ (github.event_name == 'workflow_dispatch' && !inputs.prerelease) || (github.event_name != 'workflow_dispatch' && github.ref_type == 'tag' && !contains(github.ref_name, '-')) }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: out/*

<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link rel="icon" type="image/png" href="/icon.png">
    <title>NINJAM Advanced VDO Client</title>
    <style>
        * { box-sizing: border-box; }
        html, body { width: 100%; height: 100%; margin: 0; }
        body {
            background: #0a0b10;
            color: #e7eaf0;
            font-family: "Segoe UI", Arial, sans-serif;
        }
        .app {
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-rows: auto 1fr auto;
        }
        .header {
            background: linear-gradient(180deg, #171a22 0%, #10131a 100%);
            border-bottom: 1px solid #2a3040;
            padding: 10px 14px;
            display: grid;
            gap: 4px;
        }
        .title {
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.2px;
        }
        .meta {
            font-size: 13px;
            color: #aeb7c9;
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
        }
        .peer-statuses {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            font-size: 12px;
            align-items: center;
        }
        .peer-light-wrap {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            color: #aeb7c9;
            max-width: 150px;
        }
        .peer-light-name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .peer-route {
            padding: 1px 4px;
            border: 1px solid rgba(143,183,255,0.45);
            border-radius: 4px;
            color: #9fc1ff;
            font-size: 9px;
            font-weight: 700;
            line-height: 1.2;
            flex: 0 0 auto;
        }
        .peer-route:empty {
            display: none;
        }
        .peer-route.fail {
            border-color: rgba(207,67,67,0.65);
            color: #ff8d8d;
        }
        .peer-light {
            width: 11px;
            height: 11px;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.45);
            background: #cf4343;
            box-shadow: 0 0 7px rgba(207,67,67,0.75);
            cursor: pointer;
            padding: 0;
            flex: 0 0 auto;
        }
        .peer-light.ok {
            background: #3ed06e;
            box-shadow: 0 0 7px rgba(62,208,110,0.75);
        }
        .peer-light.degraded {
            background: #e6a23c;
            box-shadow: 0 0 7px rgba(230,162,60,0.75);
        }
        .peer-light:focus-visible {
            outline: 2px solid #8fb7ff;
            outline-offset: 2px;
        }
        .frame-wrap {
            width: 100%;
            height: 100%;
            background: #000;
        }
        #vdoFrame {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
            background: #000;
        }
        .footer {
            min-height: 36px;
            padding: 6px 14px;
            border-top: 1px solid #2a3040;
            background: #0f1218;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .beat-counter {
            display: flex;
            align-items: center;
            gap: 9px;
            width: 100%;
            flex: 1 1 auto;
            min-width: 0;
            color: #fffdd0;
            font-size: 12px;
            font-variant-numeric: tabular-nums;
        }
        .beat-counter-label {
            min-width: 64px;
            flex: 0 0 auto;
            color: #fffdd0;
            white-space: nowrap;
        }
        .beat-strip {
            display: flex;
            flex-wrap: nowrap;
            column-gap: 3px;
            row-gap: 10px;
            align-items: flex-start;
            width: 100%;
            flex: 1 1 auto;
            min-width: 0;
            padding-bottom: 8px;
        }
        .beat-dot {
            height: 13px;
            min-width: 9px;
            flex: 1 1 0;
            border: 1px solid rgba(255,253,208,0.28);
            border-radius: 2px;
            background: rgba(0,0,0,0.34);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: visible;
            color: transparent;
            font-variant-numeric: tabular-nums;
            user-select: none;
        }
        .beat-dot.past {
            background: #fffdd0;
            border-color: #fffdd0;
        }
        .beat-dot.active {
            background: #fffdd0;
            border-color: #fffdd0;
            box-shadow: 0 0 9px rgba(255,253,208,var(--beat-glow-alpha,0.85));
        }
        .beat-current-number,
        .beat-bar-label {
            position: absolute;
            left: 0;
            right: 0;
            text-align: center;
            line-height: 1;
            pointer-events: none;
        }
        .beat-current-number {
            top: 1px;
            color: rgba(0,0,0,var(--beat-number-alpha,0.95));
            font-size: 7px;
            font-weight: 800;
        }
        .beat-current-number.compact {
            font-size: 6px;
        }
        .beat-current-number.tiny {
            font-size: 5px;
        }
        .beat-bar-label {
            bottom: -8px;
            height: 8px;
            min-width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(18,18,16,0.95);
            border: 1px solid rgba(255,253,208,0.28);
            border-top: 0;
            border-radius: 0 0 3px 3px;
            color: rgba(255,253,208,0.78);
            font-size: 6px;
            font-weight: 700;
        }
        .beat-bar-label.compact {
            font-size: 5px;
        }
        .beat-dot.past .beat-bar-label {
            background: rgba(255,255,255,0.36);
            border-color: rgba(255,255,255,0.44);
            color: rgba(0,0,0,0.72);
        }
        .beat-dot.active .beat-bar-label {
            background: #fffdd0;
            border-color: #fffdd0;
            color: rgba(0,0,0,var(--beat-number-alpha,0.95));
            box-shadow: 0 2px 7px rgba(255,253,208,var(--beat-glow-alpha,0.85));
        }
        body.green-mode {
            background: #00ff00;
        }
        body.green-mode .app {
            grid-template-rows: 1fr;
        }
        body.green-mode .header,
        body.green-mode .footer {
            display: none;
        }
        body.green-mode .frame-wrap {
            background: #00ff00;
        }
        body.hide-footer .app {
            grid-template-rows: auto 1fr;
        }
        body.hide-footer .footer {
            display: none;
        }
        .obs-grid {
            display: none;
            width: 100%;
            height: 100%;
            background: #000;
            gap: 0;
            overflow: hidden;
        }
        .obs-tile {
            min-width: 0;
            min-height: 0;
            background: #000;
            overflow: hidden;
        }
        .obs-tile iframe {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
            background: #000;
        }
        body.obs-mode {
            background: #000;
        }
        body.obs-mode .app {
            grid-template-rows: 1fr;
        }
        body.obs-mode .header,
        body.obs-mode .footer {
            display: none;
        }
        body.obs-mode .frame-wrap {
            position: relative;
            background: #000;
        }
        body.obs-mode #vdoFrame {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }
        body.obs-mode .obs-grid {
            display: grid;
        }
        .obs-grid.layout-tiles {
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        }
        .obs-grid.layout-rows {
            grid-template-columns: minmax(0, 1fr);
        }
        .obs-grid.layout-columns {
            grid-auto-flow: column;
            grid-auto-columns: minmax(280px, 1fr);
            overflow-x: hidden;
        }
        .obs-grid.single {
            grid-template-columns: minmax(0, 1fr);
            grid-auto-flow: row;
        }
    </style>
</head>
<body>
    <div class="app">
        <div class="header" id="header">
            <div class="title">NINJAM video room</div>
            <div class="meta">
                <span id="roomValue"></span>
                <span id="labelValue"></span>
                <span id="syncValue"></span>
                <span id="peerStatusValue" class="peer-statuses"></span>
            </div>
        </div>
        <div class="frame-wrap">
            <div id="obsGrid" class="obs-grid" aria-hidden="true"></div>
            <iframe id="vdoFrame" allow="camera; microphone; fullscreen"></iframe>
        </div>
        <div class="footer">
            <div class="beat-counter" id="beatCounter" aria-live="polite">
                <span class="beat-counter-label" id="beatCounterText">BPI --/--</span>
                <span class="beat-strip" id="beatStrip" aria-hidden="true"></span>
            </div>
        </div>
    </div>
    <script>
        const query = new URLSearchParams(window.location.search);
        const ninjamServer = query.get('ninjamServer') || '';
        const roomParam = query.get('room');
        const roomFromServer = ninjamServer ? ninjamServer.replace(/\./g, '_') : '';
        const resolvedRoom = roomParam || roomFromServer || 'ninjam';
        const minimumBufferMs = 0;
        const helperRequestToken = '__NINJAM_HELPER_TOKEN__';
        const vdoPeerSyncEndpoint = '/vdo-peer-sync?token=' + encodeURIComponent(helperRequestToken);
        const obsMode = query.get('obs') === '1' || String(query.get('view') || '').toLowerCase() === 'obs';
        function normalizeBufferMode(value) {
            const mode = String(value || '').trim().toLowerCase();
            if (mode === 'realtime' || mode === 'voice' || mode === 'voicechat') {
                return 'realtime';
            }
            return 'remote';
        }

        function normalizeObsLayout(value) {
            const layout = String(value || 'tiles').toLowerCase();
            return layout === 'rows' || layout === 'columns' ? layout : 'tiles';
        }

        function normalizeObsSlot(value) {
            const slot = parseInt(value || '0', 10);
            return isFinite(slot) ? Math.max(0, Math.min(12, slot)) : 0;
        }

        function normalizeCameraFx(value) {
            const fx = String(value || 'off').trim().toLowerCase();
            if (fx === 'blur' || fx === '3' || fx === '3a') return 'blur';
            if (fx === 'remove' || fx === 'transparent' || fx === 'background-remove' || fx === 'backgroundremove' || fx === '16') return 'remove';
            if (fx === 'green' || fx === 'greenscreen' || fx === 'green-screen' || fx === '4') return 'green';
            if (fx === 'image' || fx === 'virtual' || fx === 'virtual-background' || fx === 'background' || fx === '5') return 'image';
            return 'off';
        }

        function normalizeCameraFxStrength(value) {
            const strength = parseInt(value || '4', 10);
            return isFinite(strength) ? Math.max(1, Math.min(20, strength)) : 4;
        }

        function normalizeCameraBufferMode(value) {
            const mode = String(value || 'sync').trim().toLowerCase();
            return mode === 'realtime' || mode === 'real-time' || mode === 'rt' || mode === 'live' ? 'realtime' : 'sync';
        }

        function cameraLabelBufferMode(label) {
            const raw = String(label || '').toLowerCase();
            return /\[(rt|realtime|real-time)\]/.test(raw) || /(^|[\s_-])(rt|realtime|real-time)($|[\s_-])/.test(raw)
                ? 'realtime'
                : 'sync';
        }

        function localVdoLabel() {
            const base = normalizeUserId(appState.vdoSyncUserKey || appState.label) || appState.label;
            return appState.cameraBufferMode === 'realtime' ? (base + ' [Realtime]') : base;
        }

        function normalizeVdoQualityPreset(value) {
            const preset = String(value || 'default').trim().toLowerCase();
            if (preset === '1080p60-10000' || preset === '1080p60hq' || preset === 'hq10000' || preset === 'high10000' || preset === '10000') return '1080p60-10000';
            if (preset === '1080p30-10000' || preset === '1080p30hq' || preset === 'fullhd30hq') return '1080p30-10000';
            if (preset === '1080p60-8000' || preset === 'hq8000' || preset === 'high8000' || preset === '8000') return '1080p60-10000';
            if (preset === '1080p60' || preset === 'high' || preset === 'fullhd60') return '1080p60-10000';
            if (preset === '1080p30' || preset === 'fullhd30') return '1080p30';
            if (preset === '720p60' || preset === 'hd60') return '720p60';
            if (preset === '720p30' || preset === 'hd30') return '720p30';
            if (preset === '360p30' || preset === 'low') return '360p30';
            return 'default';
        }

        function normalizeVdoCodec(value) {
            const codec = String(value || 'default').trim().toLowerCase();
            if (codec === 'vp8') return 'vp8';
            if (codec === 'vp9') return 'vp9';
            if (codec === 'h264' || codec === '264' || codec === 'avc') return 'h264';
            if (codec === 'av1') return 'av1';
            return 'default';
        }

        function queryFpsValue() {
            return parseInt(query.get('fps') || query.get('fr') || query.get('frameRate') || query.get('mfr') || query.get('maxframerate') || '', 10) || 0;
        }

        function queryBitrateValue() {
            return parseInt(query.get('cameraBitrate') || query.get('vdoBitrate') || query.get('bitrate') || query.get('videobitrate') || query.get('vb') || '', 10) || 0;
        }

        function initialVdoQualityPreset() {
            const directQuality = query.get('cameraQuality') || query.get('vdoQuality');
            if (directQuality) return normalizeVdoQualityPreset(directQuality);
            const quality = String(query.get('quality') || query.get('q') || '').trim().toLowerCase();
            const fps = queryFpsValue();
            const bitrate = queryBitrateValue();
            if ((quality === '0' || quality === '1080' || quality === '1080p' || quality === 'fullhd' || quality === 'high') && fps >= 60 && bitrate >= 8000) return '1080p60-10000';
            if ((quality === '0' || quality === '1080' || quality === '1080p' || quality === 'fullhd' || quality === 'high') && fps >= 60) return '1080p60-10000';
            if ((quality === '0' || quality === '1080' || quality === '1080p' || quality === 'fullhd' || quality === 'high') && fps > 0 && fps <= 30 && bitrate >= 8000) return '1080p30-10000';
            if ((quality === '0' || quality === '1080' || quality === '1080p' || quality === 'fullhd' || quality === 'high') && fps > 0 && fps <= 30) return '1080p30';
            if ((quality === '1' || quality === '720' || quality === '720p' || quality === 'hd') && fps >= 60) return '720p60';
            if ((quality === '1' || quality === '720' || quality === '720p' || quality === 'hd') && fps > 0 && fps <= 30) return '720p30';
            if ((quality === '2' || quality === '360' || quality === '360p' || quality === 'low') && fps > 0 && fps <= 30) return '360p30';
            return 'default';
        }

        function initialVdoCodec() {
            return normalizeVdoCodec(query.get('cameraCodec') || query.get('vdoCodec') || query.get('chunkcodec') || query.get('codec') || query.get('videocodec') || 'default');
        }

        function initialCameraFx() {
            const directFx = query.get('cameraFx') || query.get('vdoFx') || query.get('videoFx');
            if (directFx) return normalizeCameraFx(directFx);
            return normalizeCameraFx(query.get('effects') || query.get('effect') || 'off');
        }

        function queryInteger(names, fallback, min, max) {
            for (let i = 0; i < names.length; i++) {
                const raw = query.get(names[i]);
                if (raw === null || raw === '') {
                    continue;
                }
                const parsed = parseInt(raw, 10);
                if (!isFinite(parsed)) {
                    continue;
                }
                return Math.max(min, Math.min(max, parsed));
            }
            return fallback;
        }

        const appState = {
            room: resolvedRoom,
            label: query.get('label') || 'NINJAM',
            vdoSyncUserKey: query.get('vdoSyncUserKey') || '',
            store: query.get('store') || '',
            bg: query.get('bg') || '',
            intervalSource: query.get('intervalSource') || '',
            intervalPollMs: parseInt(query.get('intervalPollMs') || '', 10) || 500,
            requestedBufferMs: Math.max(minimumBufferMs, parseInt(query.get('buffer') || '', 10) || minimumBufferMs),
            chunkedMs: queryInteger(['chunkbitrate', 'chunked', 'bitrate'], 2500, 60, 100000),
            ninjamServer: ninjamServer,
            initialBufferMode: normalizeBufferMode(query.get('bufferMode')),
            obsMode: obsMode,
            obsLayout: normalizeObsLayout(query.get('obsLayout') || query.get('layout') || 'tiles'),
            obsSlot: normalizeObsSlot(query.get('obsSlot') || query.get('slot') || '0'),
            cameraCodec: initialVdoCodec(),
            cameraQuality: initialVdoQualityPreset(),
            cameraFx: initialCameraFx(),
            cameraFxStrength: normalizeCameraFxStrength(query.get('cameraFxStrength') || query.get('effectvalue') || query.get('ev') || '4'),
            cameraBgImage: query.get('cameraBgImage') || query.get('backgroundImage') || query.get('bgImage') || '',
            cameraBufferMode: normalizeCameraBufferMode(query.get('cameraBufferMode') || query.get('sourceBufferMode') || query.get('cameraMode') || query.get('vdoCameraMode') || 'sync'),
            intervalMessages: 0
        };

        const vdoFrame = document.getElementById('vdoFrame');
        const obsGrid = document.getElementById('obsGrid');
        const roomValue = document.getElementById('roomValue');
        const labelValue = document.getElementById('labelValue');
        const syncValue = document.getElementById('syncValue');
        const peerStatusValue = document.getElementById('peerStatusValue');
        const beatCounterText = document.getElementById('beatCounterText');
        const beatStrip = document.getElementById('beatStrip');

        const ninjamSync = {
            intervalInfo: null,
            remoteTimecodes: {},
            remoteBuffers: {},
            remoteVoiceChatMode: {},
            remoteDiagnostics: {},
            userLastSeenAt: {},
            userLastSampleKey: {},
            setIntervalInfo(interval, pos, bpm, bpi, length, bufferMode, voiceChatMode, globalBeat, wallClockMs) {
                const timingOriginMs = (typeof wallClockMs === 'number' && isFinite(wallClockMs)) ? wallClockMs : Date.now();
                this.intervalInfo = {
                    interval,
                    pos,
                    bpm,
                    bpi,
                    length: typeof length === 'number' ? length : 0,
                    globalBeat: typeof globalBeat === 'number' && isFinite(globalBeat) ? globalBeat : NaN,
                    bufferMode: normalizeBufferMode(bufferMode || (voiceChatMode ? 'realtime' : 'remote')),
                    voiceChatMode: !!voiceChatMode,
                    updatedAt: timingOriginMs
                };
            },
            setRemoteTimecode(userId, interval, timecode, bufferMs, sampleKey, voiceChatMode, diagnostics) {
                const key = normalizeUserId(userId);
                if (!key || isServerBotUserId(key)) {
                    return;
                }
                this.remoteVoiceChatMode[key] = !!voiceChatMode;
                if (diagnostics) {
                    this.remoteDiagnostics[key] = diagnostics;
                }
                if (this.userLastSampleKey[key] === sampleKey) {
                    this.userLastSeenAt[key] = Date.now();
                    return;
                }
                this.userLastSampleKey[key] = sampleKey;
                if (!this.remoteTimecodes[key]) {
                    this.remoteTimecodes[key] = {};
                }
                this.remoteTimecodes[key][interval] = {
                    timecode,
                    updatedAt: Date.now()
                };
                if (typeof bufferMs === 'number' && isFinite(bufferMs) && bufferMs >= 0) {
                    this.remoteBuffers[key] = Math.round(bufferMs);
                }
                this.userLastSeenAt[key] = Date.now();
            }
        };

        const vdoState = {
            iframeLoaded: false,
            streamIdByUser: {},
            targetIdByUser: {},
            cameraTargetsByUser: {},
            labelByStreamId: {},
            lastAppliedBufferByUser: {},
            lastBufferRefreshIdByUser: {},
			lastVoiceChatModeByUser: {},
			bufferRefreshTimersByUser: {},
			bufferRefreshPendingUntilByUser: {},
			bufferApplyTimersByUser: {},
			pendingBufferMsByUser: {},
			obsTilesByUser: {},
            latencyMsByUser: {},
            latencyTargetMsByUser: {},
            latencyUpdatedAtByUser: {},
            chunkEventsByStreamId: {},
            chunkStatsByUser: {},
            mappingSourceByUser: {},
            mappingDiagnosticsByUser: {},
            lastResolveSource: '',
            lastResolveDiagnostic: '',
            lastRosterRevision: '',
            recentVdoPeerSyncEvents: {},
            bufferRefreshSequence: 0,
            rosterTimerId: 0
        };

        const manualOffsetsMs = {};
		const remoteUserStaleMs = 12000;
		const vdoLatencyStaleMs = 8000;
		const vdoLatencyMaxStepMs = 50;
		const bufferApplyDebounceMs = 150;
		const bufferApplyDeadbandMs = 5;

        if (!appState.intervalSource) {
            appState.intervalSource = window.location.origin + '/intervals';
        }

        function normalizeUserId(userId) {
            let value = String(userId || '').trim().toLowerCase();
            value = value.replace(/^anonymous:/, '');
            value = value.replace(/^guest:/, '');
            value = value.replace(/\s+/g, '');
            value = value.replace(/@.*$/, '');
            value = value.replace(/[^a-z0-9._-]/g, '');
            return value;
        }

        function isServerBotUserId(userId) {
            const key = normalizeUserId(userId);
            const compact = key.replace(/[^a-z0-9]/g, '');
            if (!compact) {
                return false;
            }
            const botPrefixes = ['ninbot', 'jambot', 'ninjambot', 'jamulusbot', 'jamserverbot', 'ninjamserverbot', 'serverbot'];
            for (let i = 0; i < botPrefixes.length; i++) {
                const prefix = botPrefixes[i];
                if (compact === prefix || compact.indexOf(prefix) === 0) {
                    return true;
                }
            }
            return false;
        }

        function getOffsetStorageKey(userId) {
            return 'ninjamPeerOffset:' + appState.room + ':' + normalizeUserId(userId);
        }

        function getManualOffsetMs(userId) {
            const key = normalizeUserId(userId);
            if (typeof manualOffsetsMs[key] === 'number' && isFinite(manualOffsetsMs[key])) {
                return Math.round(manualOffsetsMs[key]);
            }
            try {
                if (window.localStorage) {
                    const raw = window.localStorage.getItem(getOffsetStorageKey(key));
                    const parsed = parseInt(raw || '', 10);
                    if (isFinite(parsed)) {
                        manualOffsetsMs[key] = parsed;
                        return parsed;
                    }
                }
            } catch (e) {
            }
            manualOffsetsMs[key] = 0;
            return 0;
        }

        function setManualOffsetMs(userId, value) {
            const key = normalizeUserId(userId);
            const nextValue = Math.max(-6000, Math.min(6000, Math.round(value)));
            manualOffsetsMs[key] = nextValue;
            try {
                if (window.localStorage) {
                    window.localStorage.setItem(getOffsetStorageKey(key), String(nextValue));
                }
            } catch (e) {
            }
            return nextValue;
        }

        function copyTextToClipboard(text) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                return navigator.clipboard.writeText(text);
            }
            return new Promise(function (resolve, reject) {
                try {
                    const temp = document.createElement('textarea');
                    temp.value = text;
                    temp.style.position = 'fixed';
                    temp.style.left = '-9999px';
                    document.body.appendChild(temp);
                    temp.focus();
                    temp.select();
                    const ok = document.execCommand('copy');
                    document.body.removeChild(temp);
                    if (ok) resolve();
                    else reject(new Error('copy failed'));
                } catch (err) {
                    reject(err);
                }
            });
        }

        function buildUserSampleKey(data, bufferMs) {
            return [
                String(data.interval ?? ''),
                String(data.syncTag ?? ''),
                String(data.videoClockMs ?? ''),
                String(data.timecode ?? ''),
                String(data.eventId ?? ''),
                String(data.bufferRefreshEventId ?? ''),
                String(data.refreshBuffer ? 1 : 0),
                String(data.voiceChatMode ? 1 : 0),
                String(data.intervalMeasurementSeen ? 1 : 0),
                String(data.bufferCalculated ? 1 : 0),
                String(data.serverRouteLatencyReady ? 1 : 0),
                String(data.vdoPeerSyncReceived ? 1 : 0),
                String(data.vdoPeerSyncAcked ? 1 : 0),
                String(data.syncMessageReceived ? 1 : 0),

							childContext = {
                                streamId: childKey,
                                targetId: nextContext.targetId,
                                label: nextContext.label
                            };
                        }
                        visit(child, depth + 1, childContext);
                    }
                }
            }

            visit(root, 0, { streamId: '', targetId: '', label: '' });
            return byUser;
        }

        function setEstimatedVdoLatencyMs(userId, latencyMs) {
            const userKey = normalizeUserId(userId);
            if (!userKey || !isFinite(latencyMs) || latencyMs < 0) {
                return false;
            }
            const observedValue = Math.round(clampLatencyMs(latencyMs));
            const previousTarget = vdoState.latencyTargetMsByUser[userKey];
            const targetValue = (typeof previousTarget === 'number' && isFinite(previousTarget))
                ? Math.round(previousTarget * 0.65 + observedValue * 0.35)
                : observedValue;
            const previousApplied = vdoState.latencyMsByUser[userKey];
            let appliedValue = targetValue;
            if (typeof previousApplied === 'number' && isFinite(previousApplied)) {
                const delta = targetValue - previousApplied;
                const limitedDelta = Math.max(-vdoLatencyMaxStepMs, Math.min(vdoLatencyMaxStepMs, delta));
                appliedValue = Math.round(previousApplied + limitedDelta);
            }
            vdoState.latencyTargetMsByUser[userKey] = targetValue;
            vdoState.latencyMsByUser[userKey] = appliedValue;
            vdoState.latencyUpdatedAtByUser[userKey] = Date.now();
            return previousApplied !== appliedValue;
        }

        function handleVdoChunkEvent(data) {
            if (!data || typeof data !== 'object' || (data.action !== 'chunked-inbound' && data.action !== 'chunked-outbound')) {
                return false;
            }
            const value = data.value && typeof data.value === 'object' ? data.value : {};
            const streamId = String(data.streamID || value.streamID || '').trim();
            if (!streamId) {
                return false;
            }
            const prior = vdoState.chunkEventsByStreamId[streamId] || {};
            const now = Date.now();
            const chunkTs = typeof value.ts === 'number' && isFinite(value.ts) ? value.ts : Number(value.ts);
            const direction = data.action === 'chunked-inbound' ? 'in' : 'out';
            const type = value.type || 'unknown';
            const shouldRefresh = !prior.updatedAt
                || (now - prior.updatedAt) >= 1000
                || prior.direction !== direction
                || prior.type !== type;
            vdoState.chunkEventsByStreamId[streamId] = {
                direction: direction,
                type: type,
                ts: isFinite(chunkTs) ? chunkTs : NaN,
                updatedAt: now
            };
            return shouldRefresh;
        }

        function updateVdoChunkStats(root) {
            if (!root || typeof root !== 'object') {
                return false;
            }
            const statsRoot = root.stats && typeof root.stats === 'object' ? root.stats : root;
            const inbound = statsRoot.inbound && typeof statsRoot.inbound === 'object' ? statsRoot.inbound : null;
            if (!inbound) {
                return false;
            }
            let changed = false;
            const entries = Object.entries(inbound);
            for (let i = 0; i < entries.length; i++) {
                const streamId = String(entries[i][0] || '').trim();
                const stats = entries[i][1];
                if (!streamId || !stats || typeof stats !== 'object') {
                    continue;
                }
                const chunkStats = stats.chunked_mode_video && typeof stats.chunked_mode_video === 'object'
                    ? stats.chunked_mode_video
                    : null;
                if (!chunkStats) {
                    continue;
                }
                const userKey = resolveUserKeyFromPeerIds(streamId, '', vdoState.labelByStreamId[streamId] || '');
                if (!userKey) {
                    continue;
                }
                const targetMs = getNumericProperty(chunkStats, ['buffer_buffer']);
                const deltaMs = getNumericProperty(chunkStats, ['buffer_delta']);
                const levelMs = getNumericProperty(chunkStats, ['buffer_level']);
                const nextStats = {
                    targetMs: isFinite(targetMs) ? targetMs : NaN,
                    deltaMs: isFinite(deltaMs) ? deltaMs : NaN,
                    levelMs: isFinite(levelMs) ? levelMs : NaN,
                    scheduler: typeof chunkStats.scheduler === 'string' ? chunkStats.scheduler : '',
                    audioContextState: typeof chunkStats.audio_context_state === 'string' ? chunkStats.audio_context_state : '',
                    rebuffering: chunkStats.rebuffering === true,
                    awaitingKeyframe: chunkStats.awaiting_keyframe === true,
                    decoderErrors: getNumericProperty(chunkStats, ['decoder_errors']),
                    updatedAt: Date.now()
                };
                const prior = vdoState.chunkStatsByUser[userKey] || {};
                changed = changed
                    || Math.round(prior.targetMs || -1) !== Math.round(nextStats.targetMs || -1)
                    || Math.round(prior.deltaMs || -1) !== Math.round(nextStats.deltaMs || -1)
                    || Math.round(prior.levelMs || -1) !== Math.round(nextStats.levelMs || -1)
                    || prior.scheduler !== nextStats.scheduler
                    || prior.audioContextState !== nextStats.audioContextState
                    || prior.rebuffering !== nextStats.rebuffering
                    || prior.awaitingKeyframe !== nextStats.awaitingKeyframe
                    || Math.round(prior.decoderErrors || 0) !== Math.round(nextStats.decoderErrors || 0);
                vdoState.chunkStatsByUser[userKey] = nextStats;
            }
            return changed;
        }

        function getEstimatedVdoLatencyMs(userId) {
            const userKey = normalizeUserId(userId);
            if (!userKey) {
                return 0;
            }
            const updatedAt = vdoState.latencyUpdatedAtByUser[userKey] || 0;
            if (updatedAt > 0 && (Date.now() - updatedAt) > vdoLatencyStaleMs) {
                return 0;
            }
            const latencyMs = vdoState.latencyMsByUser[userKey];
            if (typeof latencyMs !== 'number' || !isFinite(latencyMs) || latencyMs < 0) {
                return 0;
            }
            return Math.round(latencyMs);
        }

        function isRealtimePeerMode(userId) {
            const userKey = normalizeUserId(userId);
            if (!userKey) {
                return false;
            }
            return !!ninjamSync.remoteVoiceChatMode[userKey];
        }

        function getDesiredBufferMs(userKey) {
            if (isRealtimePeerMode(userKey)) {
                return minimumBufferMs;
            }
            const baseBuffer = ninjamSync.remoteBuffers[userKey];
            const safeBase = (typeof baseBuffer === 'number' && isFinite(baseBuffer) && baseBuffer >= 0)
                ? Math.round(baseBuffer)
                : appState.requestedBufferMs;
            return Math.max(minimumBufferMs, safeBase - getEstimatedVdoLatencyMs(userKey) + getManualOffsetMs(userKey));
        }

        function postToVdo(message) {
            if (!vdoFrame || !vdoFrame.contentWindow) {
                return false;
            }
            try {
                vdoFrame.contentWindow.postMessage(message, '*');
                return true;
            } catch (e) {
            }
            return false;
        }

        function localVdoSyncUserId() {
            let value = String(appState.vdoSyncUserKey || appState.label || '').trim().toLowerCase();
            const atIndex = value.indexOf('@');
            if (atIndex > 0) {
                value = value.substring(0, atIndex);
            }
            value = value.replace(/^anonymous:/, '');
            value = value.replace(/^guest:/, '');
            return value;
        }

        function pruneRecentVdoPeerSyncEvents() {
            const cutoff = Date.now() - 120000;
            const eventIds = Object.keys(vdoState.recentVdoPeerSyncEvents);
            for (let i = 0; i < eventIds.length; i++) {
                if (vdoState.recentVdoPeerSyncEvents[eventIds[i]] < cutoff) {
                    delete vdoState.recentVdoPeerSyncEvents[eventIds[i]];
                }
            }
        }

        function rememberVdoPeerSyncEvent(eventId) {
            const key = String(eventId || '').trim();
            if (!key) {
                return false;
            }
            pruneRecentVdoPeerSyncEvents();
            if (vdoState.recentVdoPeerSyncEvents[key]) {
                return false;
            }
            vdoState.recentVdoPeerSyncEvents[key] = Date.now();
            return true;
        }

        function forwardVdoPeerSyncToNative(signalType, sender, payload) {
            if (!signalType || !sender || !payload || typeof payload !== 'object') {
                return Promise.resolve(false);
            }
            return fetch(vdoPeerSyncEndpoint, {
                method: 'POST',
                cache: 'no-store',
                headers: { 'Content-Type': 'application/json;charset=UTF-8' },
                body: JSON.stringify({
                    version: 1,
                    signalType: signalType,
                    sender: sender,
                    payload: payload
                })
            }).then(function (response) {
                return response.ok;
            }).catch(function () {
                return false;
            });
        }

        function sendVdoPeerSyncTag(data) {
            const payload = data && data.payload && typeof data.payload === 'object' ? data.payload : null;
            const eventId = payload ? String(payload.eventId || '').trim() : '';
            const sentEventKey = 'sent:' + eventId;
            pruneRecentVdoPeerSyncEvents();
            if (!payload || !eventId || vdoState.recentVdoPeerSyncEvents[sentEventKey]) {
                return false;
            }

            const queuedAt = Number(data.queuedAtWallClockMs);
            const queuedAgeMs = isFinite(queuedAt) && queuedAt > 0 ? Math.max(0, Date.now() - queuedAt) : 0;
            if (queuedAgeMs > 4000) {
                return false;
            }

            const outboundPayload = Object.assign({}, payload);
            const originalSendOffsetMs = Number(outboundPayload.sendOffsetMs);
            outboundPayload.sendOffsetMs = Math.max(0,
                (isFinite(originalSendOffsetMs) ? originalSendOffsetMs : 0) + queuedAgeMs);
            const sent = postToVdo({
                sendData: {
                    ninjamPlusSync: {
                        version: 1,
                        signalType: 'intervalSyncTag',
                        payload: outboundPayload
                    }
                },
                type: 'pcs'
            });
            if (sent) {
                vdoState.recentVdoPeerSyncEvents[sentEventKey] = Date.now();
            }
            return sent;
        }

        function extractVdoPeerSyncEnvelope(data) {
            if (!data || !Object.prototype.hasOwnProperty.call(data, 'dataReceived')) {
                return null;
            }
            let received = data.dataReceived;
            if (typeof received === 'string') {
                try {
                    received = JSON.parse(received);
                } catch (e) {
                    return null;
                }
            }
            if (!received || typeof received !== 'object'
                || !received.ninjamPlusSync || typeof received.ninjamPlusSync !== 'object') {
                return null;
            }
            return received.ninjamPlusSync;
        }

        function handleVdoPeerSyncData(data) {
            const envelope = extractVdoPeerSyncEnvelope(data);
            if (!envelope || Number(envelope.version) !== 1) {
                return false;
            }
            const signalType = String(envelope.signalType || '').trim();
            const payload = envelope.payload && typeof envelope.payload === 'object'
                ? Object.assign({}, envelope.payload) : null;
            const sender = payload ? String(payload.userId || '').trim() : '';
            const senderKey = normalizeUserId(sender);
            if (!payload || !senderKey || senderKey === normalizeUserId(localVdoSyncUserId())) {
                return true;
            }
            const transportStreamId = String(data.streamID || data.streamId || '').trim();
            const transportPeerId = String(data.UUID || data.uuid || '').trim();
            const transportLabel = vdoState.labelByStreamId[transportStreamId]
                || vdoState.labelByStreamId[transportPeerId]
                || '';
            const transportUserKey = resolveUserKeyFromPeerIds(
                transportStreamId,
                transportPeerId,
                transportLabel);
            if ((transportUserKey && normalizeUserId(transportUserKey) !== senderKey)
                || (transportLabel && normalizeUserId(transportLabel) !== senderKey)) {
                return true;
            }

            if (signalType === 'intervalSyncTag') {
                const eventId = String(payload.eventId || '').trim();
                if (payload.type !== 'intervalSyncTag' || !eventId
                    || !rememberVdoPeerSyncEvent('tag:' + senderKey + ':' + eventId)) {
                    return true;
                }

                payload.vdoPeerReceivedWallClockMs = Date.now();
                const ackPayload = {
                    type: 'intervalSyncAck',
                    userId: localVdoSyncUserId(),
                    targetUserId: sender,
                    ackEventId: eventId,
                    eventId: 'vdoPeerAck:' + localVdoSyncUserId() + ':' + eventId
                };
                const ackMessage = {
                    sendData: {
                        ninjamPlusSync: {
                            version: 1,
                            signalType: 'intervalSyncAck',
                            payload: ackPayload
                        }
                    },
                    type: 'pcs'
                };
                const peerUuid = String(data.UUID || data.uuid || '').trim();
                const peerStreamId = String(data.streamID || data.streamId || '').trim();
                if (peerUuid) {
                    ackMessage.UUID = peerUuid;
                } else if (peerStreamId) {
                    ackMessage.streamID = peerStreamId;
                }
                forwardVdoPeerSyncToNative('intervalSyncTag', sender, payload).then(function (accepted) {
                    if (accepted) {
                        postToVdo(ackMessage);
                    }
                });
                return true;
            }

            if (signalType === 'intervalSyncAck') {
                const ackEventId = String(payload.ackEventId || '').trim();
                const targetUserKey = normalizeUserId(payload.targetUserId || '');
                if (payload.type !== 'intervalSyncAck' || !ackEventId
                    || targetUserKey !== normalizeUserId(localVdoSyncUserId())
                    || !rememberVdoPeerSyncEvent('ack:' + senderKey + ':' + ackEventId)) {
                    return true;
                }
                forwardVdoPeerSyncToNative('intervalSyncAck', sender, payload);
                return true;
            }
            return true;
        }

        function postToObsViewerFrame(tileKey, message) {
            const tile = vdoState.obsTilesByUser[String(tileKey || '')] || null;
            const frame = tile ? tile.frame : null;
            if (!frame || !frame.contentWindow) {
                return false;
            }
            try {
                frame.contentWindow.postMessage(message, '*');
                return true;
            } catch (e) {
            }
            return false;
        }

        function sendBufferToCameraTarget(target, bufferMs) {
            if (!target || (!target.targetId && !target.streamId)) {
                return false;
            }
            const nextBuffer = Math.max(minimumBufferMs, Math.round(bufferMs));
            if (target.streamId) {
                return postToVdo({ setBufferDelay: nextBuffer, streamID: target.streamId });
            }
            return postToVdo({ setBufferDelay: nextBuffer, UUID: target.targetId });
        }

        function sendTargetedBuffer(userKey, bufferMs) {
            const key = normalizeUserId(userKey);
            const targets = getUserCameraTargets(key);
            if (!targets.length) {
                return false;
            }
            let sent = false;
            for (let i = 0; i < targets.length; i++) {
                const target = targets[i];
                const targetBuffer = target.bufferMode === 'realtime' ? minimumBufferMs : bufferMs;
                sent = sendBufferToCameraTarget(target, targetBuffer) || sent;
                if (appState.obsMode) {
                    sent = postToObsViewerFrame(obsTileKeyForTarget(key, target), { setBufferDelay: Math.max(minimumBufferMs, Math.round(targetBuffer)) }) || sent;
                }
            }
            return sent;
        }

        function sendTargetedRefresh(userKey) {
            const targets = getUserCameraTargets(userKey);
            if (!targets.length) {
                return false;
            }
            let sent = false;
            function sendRefresh(targetKey, targetValue) {
                const msg = { refresh: true };
                msg[targetKey] = targetValue;
                sent = postToVdo(msg) || sent;
                const actionMsg = { action: 'refresh' };
                actionMsg[targetKey] = targetValue;
                sent = postToVdo(actionMsg) || sent;
            }
            for (let i = 0; i < targets.length; i++) {
                const target = targets[i];
                if (target.targetId) {
                    sendRefresh('UUID', target.targetId);
                    sendRefresh('target', target.targetId);
                }
                if (target.streamId) {
                    sendRefresh('streamID', target.streamId);
                    if (!target.targetId) {
                        sendRefresh('target', target.streamId);
                    }
                }
            }
            return sent;
        }

		function sendTargetedRemove(userKey) {
            const key = normalizeUserId(userKey);
            if (!key) {
                return false;
            }

            // Do not post hangup/remove/hide commands into VDO from roster cleanup.
            // Some VDO builds treat those as a local page/session exit and show the
            // "file transfer in progress" unload confirmation when peers leave.
			return false;
		}

		function cancelPendingBufferApply(userKey) {
			const key = normalizeUserId(userKey);
			if (!key) {
				return;
			}
			if (vdoState.bufferApplyTimersByUser[key]) {
				clearTimeout(vdoState.bufferApplyTimersByUser[key]);
			}
			delete vdoState.bufferApplyTimersByUser[key];
			delete vdoState.pendingBufferMsByUser[key];
		}

		function schedulePendingBufferApply(userKey, bufferMs) {
			const key = normalizeUserId(userKey);
			if (!key || !isFinite(bufferMs)) {
				return false;
			}
			vdoState.pendingBufferMsByUser[key] = Math.round(bufferMs);
			if (vdoState.bufferApplyTimersByUser[key]) {
				clearTimeout(vdoState.bufferApplyTimersByUser[key]);
			}
			vdoState.bufferApplyTimersByUser[key] = setTimeout(function () {
				delete vdoState.bufferApplyTimersByUser[key];
				delete vdoState.pendingBufferMsByUser[key];
				if (!userHasCameraTargets(key)) {
					return;
				}
				const desiredBufferMs = getDesiredBufferMs(key);
				const lastAppliedBuffer = vdoState.lastAppliedBufferByUser[key];
				if (typeof lastAppliedBuffer === 'number'
					&& isFinite(lastAppliedBuffer)
					&& Math.abs(desiredBufferMs - lastAppliedBuffer) < bufferApplyDeadbandMs) {
					return;
				}
				if (sendTargetedBuffer(key, desiredBufferMs)) {
					vdoState.lastAppliedBufferByUser[key] = desiredBufferMs;
				}
				updateSyncStatus();
			}, bufferApplyDebounceMs);
			return true;
		}

		function scheduleBufferRefresh(userKey, refreshEventId, flushFirst) {
            const key = normalizeUserId(userKey);
            const eventId = String(refreshEventId || '');
            if (!key || !eventId || vdoState.lastBufferRefreshIdByUser[key] === eventId) {
                return false;
            }
			if (!userHasCameraTargets(key)) {
				return false;
			}
			cancelPendingBufferApply(key);
			vdoState.lastBufferRefreshIdByUser[key] = eventId;
            delete vdoState.lastAppliedBufferByUser[key];
            if (vdoState.bufferRefreshTimersByUser[key]) {
                clearTimeout(vdoState.bufferRefreshTimersByUser[key]);
            }
            vdoState.bufferRefreshPendingUntilByUser[key] = Date.now() + 150;
            if (flushFirst) {
                clearEstimatedVdoLatency(key);
                sendTargetedBuffer(key, minimumBufferMs);
            }
            sendTargetedRefresh(key);
            vdoState.bufferRefreshTimersByUser[key] = setTimeout(function () {
                delete vdoState.bufferRefreshTimersByUser[key];
                delete vdoState.bufferRefreshPendingUntilByUser[key];
                const desiredBufferMs = getDesiredBufferMs(key);
                if (sendTargetedBuffer(key, desiredBufferMs)) {
                    vdoState.lastAppliedBufferByUser[key] = desiredBufferMs;
                }
                updateSyncStatus();
            }, 150);
            return true;
        }

        function requestVdoRoster() {
            if (!vdoState.iframeLoaded) {
                return;
            }
            postToVdo({ getStreamIDs: true });
            postToVdo({ getDetailedState: true });
            postToVdo({ getStats: true });
        }

        function applyPeerBuffers() {
            const trackedUsers = getTrackedUserKeys();
            let linkedUsers = 0;
            for (let i = 0; i < trackedUsers.length; i++) {
                const userKey = trackedUsers[i];
                const hasTarget = userHasCameraTargets(userKey);
                if (hasTarget) {
                    linkedUsers += 1;
                } else {
                    continue;
                }
                const pendingUntil = vdoState.bufferRefreshPendingUntilByUser[userKey] || 0;
                if (pendingUntil > Date.now()) {
                    continue;
                }
                const desiredBufferMs = getDesiredBufferMs(userKey);
				const lastAppliedBuffer = vdoState.lastAppliedBufferByUser[userKey];
				const hasAppliedBuffer = typeof lastAppliedBuffer === 'number' && isFinite(lastAppliedBuffer);
				if (hasAppliedBuffer) {
					if (Math.abs(desiredBufferMs - lastAppliedBuffer) < bufferApplyDeadbandMs) {
						cancelPendingBufferApply(userKey);
						continue;
					}
					schedulePendingBufferApply(userKey, desiredBufferMs);
					continue;
				}
				cancelPendingBufferApply(userKey);
				if (sendTargetedBuffer(userKey, desiredBufferMs)) {
                    vdoState.lastAppliedBufferByUser[userKey] = desiredBufferMs;
                }
            }
            renderObsGrid();
            updateSyncStatus(linkedUsers, trackedUsers.length);
        }

        function buildObsViewerUrl(streamId, userKey, target) {
            const params = new URLSearchParams();
            params.set('view', String(streamId || '').trim());
            params.set('noaudio', '1');
            params.set('buffer2', '0');
            params.set('buffer', String(getCameraTargetDesiredBufferMs(userKey, target)));
            params.set('autostart', '1');
            params.set('playsinline', '1');
            params.set('cleanoutput', '1');
            return vdoIframeBaseUrl() + '?' + params.toString();
        }

        function renderObsGrid() {
            if (!appState.obsMode || !obsGrid) {
                return;
            }

            const cameraEntries = [];
            const trackedUsers = getTrackedUserKeys();
            for (let u = 0; u < trackedUsers.length; u++) {
                const userKey = trackedUsers[u];
                const targets = getUserCameraTargets(userKey).filter(function (target) { return !!target.streamId; });
                for (let t = 0; t < targets.length; t++) {
                    cameraEntries.push({ userKey: userKey, target: targets[t], tileKey: obsTileKeyForTarget(userKey, targets[t]) });
                }
            }
            let displayEntries = cameraEntries;
            if (appState.obsSlot > 0) {
                displayEntries = cameraEntries[appState.obsSlot - 1] ? [cameraEntries[appState.obsSlot - 1]] : [];
            }

            obsGrid.className = 'obs-grid layout-' + appState.obsLayout + (appState.obsSlot > 0 ? ' single' : '');
            const wanted = {};
            for (let i = 0; i < displayEntries.length; i++) {
                const entry = displayEntries[i];
                const userKey = entry.userKey;
                const target = entry.target;
                const streamId = target.streamId;
                const tileKey = entry.tileKey;
                if (!streamId) {
                    continue;
                }
                wanted[tileKey] = true;
                let tile = vdoState.obsTilesByUser[tileKey];
                const desiredBufferMs = getCameraTargetDesiredBufferMs(userKey, target);
                const desiredUrl = buildObsViewerUrl(streamId, userKey, target);
                if (!tile) {
                    const element = document.createElement('div');
                    element.className = 'obs-tile';
                    const frame = document.createElement('iframe');
                    frame.setAttribute('allow', 'fullscreen; autoplay');
                    frame.src = desiredUrl;
                    element.appendChild(frame);
                    tile = { element: element, frame: frame, streamId: streamId, bufferMs: desiredBufferMs };
                    vdoState.obsTilesByUser[tileKey] = tile;
                } else if (tile.streamId !== streamId) {
                    tile.streamId = streamId;
                    tile.bufferMs = desiredBufferMs;
                    tile.frame.src = desiredUrl;
                } else if (tile.bufferMs !== desiredBufferMs) {
                    tile.bufferMs = desiredBufferMs;
                    postToObsViewerFrame(tileKey, { setBufferDelay: desiredBufferMs });
                }
                if (tile.element.parentNode !== obsGrid) {
                    obsGrid.appendChild(tile.element);
                } else if (obsGrid.children[i] !== tile.element) {
                    obsGrid.insertBefore(tile.element, obsGrid.children[i] || null);
                }
            }

            const keys = Object.keys(vdoState.obsTilesByUser);
            for (let i = 0; i < keys.length; i++) {
                const key = keys[i];
                if (wanted[key]) {
                    continue;
                }
                const tile = vdoState.obsTilesByUser[key];
                if (tile && tile.element && tile.element.parentNode) {
                    tile.element.parentNode.removeChild(tile.element);
                }
                delete vdoState.obsTilesByUser[key];
            }
        }

        function getBeatCounterState() {
            const info = ninjamSync.intervalInfo || {};
            const bpi = parseInt(info.bpi || 0, 10) || 0;
            if (bpi <= 0) {
                return { bpi: 0, beat: 0 };
            }
            const length = typeof info.length === 'number' && isFinite(info.length) ? info.length : 0;
            const pos = typeof info.pos === 'number' && isFinite(info.pos) ? info.pos : 0;
            const interval = typeof info.interval === 'number' && isFinite(info.interval) ? info.interval : 0;
            const bpm = typeof info.bpm === 'number' && isFinite(info.bpm) ? info.bpm : 0;
            let totalBeat = NaN;
            if (length > 0) {
                const clampedPos = Math.max(0, Math.min(length - 1, pos));
                totalBeat = (interval * bpi) + ((clampedPos / length) * bpi);
            } else if (typeof info.globalBeat === 'number' && isFinite(info.globalBeat)) {
                totalBeat = info.globalBeat;
            }
            if (isFinite(totalBeat) && bpm > 0 && typeof info.updatedAt === 'number' && isFinite(info.updatedAt)) {
                totalBeat += Math.max(0, Date.now() - info.updatedAt) / (60000 / bpm);
            }
            if (!isFinite(totalBeat)) {
                return { bpi: 0, beat: 0 };
            }
            const wrappedBeat = ((totalBeat % bpi) + bpi) % bpi;
            const beatIndex = Math.floor(wrappedBeat);
            const beatPhase = wrappedBeat - beatIndex;
            return { bpi: bpi, beat: beatIndex + 1, phase: beatPhase };
        }

        function renderBeatCounter() {
            if (!beatCounterText || !beatStrip) {
                return;
            }
            const state = getBeatCounterState();
            if (state.bpi <= 0) {
                beatCounterText.textContent = 'BPI --/--';
                beatStrip.innerHTML = '';
                return;
            }
            const phase = Math.max(0, Math.min(1, state.phase || 0));
            const pulse = Math.sin(phase * Math.PI);
            const numberAlpha = (0.34 + 0.66 * pulse).toFixed(3);
            const glowAlpha = (0.45 + 0.45 * pulse).toFixed(3);
            beatCounterText.textContent = 'BPI ' + state.beat + '/' + state.bpi;
            beatStrip.innerHTML = '';
            for (let i = 1; i <= state.bpi; i++) {
                const dot = document.createElement('span');
                const isActive = i === state.beat;
                dot.className = isActive ? 'beat-dot active' : (i < state.beat ? 'beat-dot past' : 'beat-dot');
                if (isActive) {
                    dot.style.setProperty('--beat-number-alpha', numberAlpha);
                    dot.style.setProperty('--beat-glow-alpha', glowAlpha);
                    const currentNumber = document.createElement('span');
                    const beatLabel = String(i);
                    currentNumber.className = 'beat-current-number' + (beatLabel.length > 2 ? ' tiny' : (beatLabel.length > 1 ? ' compact' : ''));
                    currentNumber.textContent = beatLabel;
                    dot.appendChild(currentNumber);
                }
                if ((i - 1) % 4 === 0) {
                    const barLabel = document.createElement('span');
                    const label = String(Math.floor((i - 1) / 4) + 1);
                    barLabel.className = 'beat-bar-label' + (label.length > 1 ? ' compact' : '');
                    barLabel.textContent = label;
                    dot.appendChild(barLabel);
                }
                beatStrip.appendChild(dot);
            }
        }
        function updateSyncStatus(linkedUsers, trackedUsers) {
            const totalUsers = typeof trackedUsers === 'number' ? trackedUsers : getTrackedUserKeys().length;
            let totalLinkedUsers = typeof linkedUsers === 'number' ? linkedUsers : 0;
            let realtimeUsers = 0;
            if (typeof linkedUsers !== 'number') {
                const trackedKeys = getTrackedUserKeys();
                for (let i = 0; i < trackedKeys.length; i++) {
                    const userKey = trackedKeys[i];
                    if (userHasCameraTargets(userKey)) {
                        totalLinkedUsers += 1;
                    }
                    if (isRealtimePeerMode(userKey)) {
                        realtimeUsers += 1;
                    }
                }
            } else {
                const trackedKeys = getTrackedUserKeys();
                for (let i = 0; i < trackedKeys.length; i++) {
                    if (isRealtimePeerMode(trackedKeys[i])) {
                        realtimeUsers += 1;
                    }
                }
            }
            syncValue.textContent = 'Launch ' + appState.requestedBufferMs + 'ms | linked '
                + totalLinkedUsers + '/' + totalUsers + ' | realtime ' + realtimeUsers;
            renderBeatCounter();
            renderPeerStatuses();
        }

        function renderPeerStatuses() {
            if (!peerStatusValue) {
                return;
            }
            peerStatusValue.innerHTML = '';
            const users = getTrackedUserKeys();
            for (let i = 0; i < users.length; i++) {
                const userKey = users[i];
                const diagnostics = ninjamSync.remoteDiagnostics[userKey]
                    || { ok: false, text: 'interval pending', statusLabel: 'NO RCV / NO SENT' };
                const chunkStats = vdoState.chunkStatsByUser[userKey] || {};
                const chunkStatsFresh = typeof chunkStats.updatedAt === 'number' && (Date.now() - chunkStats.updatedAt) < 8000;
                const videoDegraded = chunkStatsFresh && (chunkStats.rebuffering || chunkStats.awaitingKeyframe);
                const wrap = document.createElement('span');
                wrap.className = 'peer-light-wrap';
                const light = document.createElement('button');
                light.type = 'button';
                light.className = diagnostics.ok ? (videoDegraded ? 'peer-light degraded' : 'peer-light ok') : 'peer-light';
                const vdoLatencyMs = getEstimatedVdoLatencyMs(userKey);
                const targetLatencyMs = vdoState.latencyTargetMsByUser[userKey];
                const targetText = (typeof targetLatencyMs === 'number'
                    && isFinite(targetLatencyMs)
                    && Math.abs(targetLatencyMs - vdoLatencyMs) >= 5)
                        ? (' -> ' + Math.round(targetLatencyMs) + 'ms')
                        : '';
                const vdoText = vdoLatencyMs > 0 ? (' | vdo comp ' + vdoLatencyMs + 'ms' + targetText) : '';
                const chunkText = chunkStatsFresh
                    ? (' | chunk target ' + formatMaybeMs(chunkStats.targetMs)
                        + ' delta ' + formatMaybeMs(chunkStats.deltaMs)
                        + ' level ' + formatMaybeMs(chunkStats.levelMs)
                        + (chunkStats.scheduler ? (' scheduler ' + chunkStats.scheduler) : '')
                        + (chunkStats.audioContextState ? (' ctx ' + chunkStats.audioContextState) : '')
                        + (chunkStats.rebuffering ? ' rebuffering' : '')
                        + (chunkStats.awaitingKeyframe ? ' awaiting keyframe' : '')
                        + (chunkStats.decoderErrors > 0 ? (' decoder errors ' + Math.round(chunkStats.decoderErrors)) : ''))
                    : '';
                const mappingSource = vdoState.mappingSourceByUser[userKey] || 'unmapped';
                const mappingDiagnostic = vdoState.mappingDiagnosticsByUser[userKey]
                    ? (' | ' + vdoState.mappingDiagnosticsByUser[userKey])
                    : '';
                const streamId = vdoState.streamIdByUser[userKey];
                const chunkEvent = streamId ? vdoState.chunkEventsByStreamId[streamId] : null;
                const chunkEventText = (chunkEvent && (Date.now() - chunkEvent.updatedAt) < 8000)
                    ? (' | last chunk ' + chunkEvent.direction + ' ' + chunkEvent.type + ' ts ' + formatMaybeMs(chunkEvent.ts))
                    : '';
                const detailText = userKey + ': ' + diagnostics.text + vdoText + chunkText + ' | map ' + mappingSource + mappingDiagnostic + chunkEventText;
                light.title = detailText + '\nClick to copy';
                light.setAttribute('aria-label', detailText);
                light.addEventListener('click', function () {
                    copyTextToClipboard(detailText).catch(function () {});
                });
                const route = document.createElement('span');
                route.className = diagnostics.ok ? 'peer-route' : 'peer-route fail';
                route.textContent = diagnostics.statusLabel || '';
                route.title = diagnostics.ok
                    ? (diagnostics.route ? ('Successful sync route: ' + diagnostics.route) : '')
                    : diagnostics.statusLabel;
                const name = document.createElement('span');
                name.className = 'peer-light-name';
                name.textContent = userKey;
                name.title = detailText;
                wrap.appendChild(light);
                wrap.appendChild(route);
                wrap.appendChild(name);
                peerStatusValue.appendChild(wrap);
            }
        }

        function pruneInactiveUsers() {
            const now = Date.now();
            const users = Object.keys(ninjamSync.userLastSeenAt || {});
            let changed = false;
            for (let i = 0; i < users.length; i++) {
                const userKey = users[i];
                const lastSeen = ninjamSync.userLastSeenAt[userKey] || 0;
                if ((now - lastSeen) <= remoteUserStaleMs) {
                    continue;
                }
                sendTargetedRemove(userKey);
                delete ninjamSync.userLastSeenAt[userKey];
                delete ninjamSync.userLastSampleKey[userKey];
                delete ninjamSync.remoteTimecodes[userKey];
                delete ninjamSync.remoteBuffers[userKey];
                delete ninjamSync.remoteVoiceChatMode[userKey];
                delete ninjamSync.remoteDiagnostics[userKey];
                deleteUserCameraTargets(userKey);
                delete vdoState.lastAppliedBufferByUser[userKey];
                delete vdoState.lastBufferRefreshIdByUser[userKey];
                delete vdoState.lastVoiceChatModeByUser[userKey];
                if (vdoState.bufferRefreshTimersByUser[userKey]) {
                    clearTimeout(vdoState.bufferRefreshTimersByUser[userKey]);
                }
				delete vdoState.bufferRefreshTimersByUser[userKey];
				delete vdoState.bufferRefreshPendingUntilByUser[userKey];
				cancelPendingBufferApply(userKey);
				delete vdoState.latencyMsByUser[userKey];
                delete vdoState.latencyTargetMsByUser[userKey];
                delete vdoState.latencyUpdatedAtByUser[userKey];
                delete vdoState.chunkStatsByUser[userKey];
                delete vdoState.mappingSourceByUser[userKey];
                delete vdoState.mappingDiagnosticsByUser[userKey];
                changed = true;
            }
            if (changed) {
                renderObsGrid();
                updateSyncStatus();
            }
        }

        function pruneUsersMissingFromPayload(activeUserKeys) {
            const activeNow = {};
            for (let i = 0; i < activeUserKeys.length; i++) {
                const key = normalizeUserId(activeUserKeys[i]);
                if (key && !isServerBotUserId(key)) {
                    activeNow[key] = true;
                }
            }

            let changed = false;
            const trackedUsers = getTrackedUserKeys();
            for (let i = 0; i < trackedUsers.length; i++) {
                const userKey = trackedUsers[i];
                if (activeNow[userKey]) {
                    continue;
                }

                sendTargetedRemove(userKey);
                delete ninjamSync.userLastSeenAt[userKey];
                delete ninjamSync.userLastSampleKey[userKey];
                delete ninjamSync.remoteTimecodes[userKey];
                delete ninjamSync.remoteBuffers[userKey];
                delete ninjamSync.remoteVoiceChatMode[userKey];
                delete ninjamSync.remoteDiagnostics[userKey];

                changed = deleteUserCameraTargets(userKey) || changed;
                delete vdoState.lastAppliedBufferByUser[userKey];

                delete vdoState.lastBufferRefreshIdByUser[userKey];
                delete vdoState.lastVoiceChatModeByUser[userKey];
                if (vdoState.bufferRefreshTimersByUser[userKey]) {
                    clearTimeout(vdoState.bufferRefreshTimersByUser[userKey]);
                }
				delete vdoState.bufferRefreshTimersByUser[userKey];
				delete vdoState.bufferRefreshPendingUntilByUser[userKey];
				cancelPendingBufferApply(userKey);
				delete vdoState.latencyMsByUser[userKey];
                delete vdoState.latencyTargetMsByUser[userKey];
                delete vdoState.latencyUpdatedAtByUser[userKey];
                delete vdoState.chunkStatsByUser[userKey];
                delete vdoState.mappingSourceByUser[userKey];
                delete vdoState.mappingDiagnosticsByUser[userKey];
                changed = true;
            }

            if (changed) {
                renderObsGrid();
                updateSyncStatus();
            }
        }

        function applyActiveRosterMessage(data) {
            if (!data || typeof data !== 'object') {
                return false;
            }
            const revision = String(data.revision ?? data.videoClockMs ?? '');
            if (!Array.isArray(data.users) || !data.users.length) {
                return false;
            }
            if (revision && vdoState.lastRosterRevision === revision) {
                return false;
            }
            if (revision) {
                vdoState.lastRosterRevision = revision;
            }
            const users = data.users;
            pruneUsersMissingFromPayload(users);
            return true;
        }

        function handleIntervalMessage(data) {
            if (!data || typeof data !== 'object') {
                return false;
            }
            appState.intervalMessages += 1;
            if (data.type === 'intervalInfo') {
                ninjamSync.setIntervalInfo(
                    data.interval,
                    data.pos,
                    data.bpm,
                    data.bpi,
                    typeof data.length === 'number' ? data.length : 0,
                    data.bufferMode,
                    data.voiceChatMode,
                    typeof data.globalBeat === 'number' ? data.globalBeat : NaN,
                    typeof data.wallClockMs === 'number' ? data.wallClockMs : NaN
                );
                updateSyncStatus();
                return false;
            }
            if (data.type === 'vdoPeerSyncTag') {
                sendVdoPeerSyncTag(data);
                return false;
            }
            if (data.type === 'activeRoster') {
                applyActiveRosterMessage(data);
                return false;
            }
            if (data.type !== 'remoteTimecode' && data.type !== 'videoTimecode') {
                return false;
            }
            const receiverBufferMs = resolveIncomingBufferMs(data);
            const userKey = data.userId || data.userKey || '';
            const normalizedUserKey = normalizeUserId(userKey);
            if (!normalizedUserKey || isServerBotUserId(normalizedUserKey)) {
                return false;
            }
            const nextVoiceChatMode = !!data.voiceChatMode;
            const previousVoiceChatMode = vdoState.lastVoiceChatModeByUser[normalizedUserKey];
            const voiceChatModeChanged = typeof previousVoiceChatMode === 'boolean'
                && previousVoiceChatMode !== nextVoiceChatMode;
            vdoState.lastVoiceChatModeByUser[normalizedUserKey] = nextVoiceChatMode;
            const diagnostics = buildSyncDiagnostics(data, receiverBufferMs);
            const incomingVdoLatencyMs = getIncomingVdoLatencyMs(data);
            if (isFinite(incomingVdoLatencyMs)) {
                setEstimatedVdoLatencyMs(userKey, incomingVdoLatencyMs);
            }
            ninjamSync.setRemoteTimecode(
                userKey,
                data.interval,
                data.timecode,
                receiverBufferMs,
                buildUserSampleKey(data, receiverBufferMs),
                data.voiceChatMode,
                diagnostics
            );
            if (voiceChatModeChanged) {
                delete vdoState.lastAppliedBufferByUser[normalizedUserKey];
                if (nextVoiceChatMode) {
                    sendTargetedBuffer(normalizedUserKey, minimumBufferMs);
                }
                requestLocalBufferRefresh(normalizedUserKey, nextVoiceChatMode ? 'voiceChatOn' : 'voiceChatOff');
            }
            if (data.refreshBuffer && data.bufferRefreshEventId) {
                scheduleBufferRefresh(userKey, data.bufferRefreshEventId, true);
            }
            return false;
        }

        function processIntervalPayload(payload) {
            const items = Array.isArray(payload) ? payload : [payload];
            for (let i = 0; i < items.length; i++) {
                const item = items[i] || {};
                handleIntervalMessage(item);
            }
            pruneInactiveUsers();
            applyPeerBuffers();
        }

        function startIntervalSource() {
            if (!appState.intervalSource) {
                return;
            }
            if (appState.intervalSource.startsWith('ws:') || appState.intervalSource.startsWith('wss:')) {
                let wsReconnectDelay = 250;
                const wsMaxReconnectDelay = 4000;
                function connectWs() {
                    try {
                        const ws = new WebSocket(appState.intervalSource);
                        ws.onopen = function () {
                            wsReconnectDelay = 250;
                        };
                        ws.onmessage = function (event) {
                            try {
                                processIntervalPayload(JSON.parse(event.data));
                            } catch (e) {
                            }
                        };
                        ws.onclose = function () {
                            setTimeout(connectWs, wsReconnectDelay);
                            wsReconnectDelay = Math.min(wsReconnectDelay * 2, wsMaxReconnectDelay);
                        };
                        ws.onerror = function () {
                            try { ws.close(); } catch (e) {}
                        };
                    } catch (e) {
                        setTimeout(connectWs, wsReconnectDelay);
                        wsReconnectDelay = Math.min(wsReconnectDelay * 2, wsMaxReconnectDelay);
                    }
                }
                connectWs();
                return;
            }

            function tick() {
                fetch(appState.intervalSource, { cache: 'no-store' })
                    .then(function (response) {
                        return response.json();
                    })
                    .then(function (payload) {
                        processIntervalPayload(payload);
                    })
                    .catch(function () {
                    })
                    .finally(function () {
                        setTimeout(tick, appState.intervalPollMs);
                    });
            }
            tick();
        }

        function applyVdoCodecParams(params) {
            if (appState.cameraCodec !== 'default') {
                // codec controls RTP/fallback paths; chunkcodec controls chunked video.
                params.set('codec', appState.cameraCodec);
                params.set('chunkcodec', appState.cameraCodec);
            }
        }

        function vdoQualityPresetConfig(preset) {
            const quality = normalizeVdoQualityPreset(preset);
            if (quality === '1080p60-10000' || quality === '1080p60') return { quality: '0', width: 1920, height: 1080, mfr: 60, bitrate: 10000 };
            if (quality === '1080p30-10000') return { quality: '0', width: 1920, height: 1080, mfr: 30, bitrate: 10000 };
            if (quality === '1080p30') return { quality: '0', width: 1920, height: 1080, mfr: 30, bitrate: 4500 };
            if (quality === '720p60') return { quality: '1', width: 1280, height: 720, mfr: 60, bitrate: 3500 };
            if (quality === '720p30') return { quality: '1', width: 1280, height: 720, mfr: 30, bitrate: 2500 };
            if (quality === '360p30') return { quality: '2', width: 640, height: 360, mfr: 30, bitrate: 1200 };
            return null;
        }

        function applyVdoQualityParams(params) {
            const config = vdoQualityPresetConfig(appState.cameraQuality);
            if (!config) {
                return;
            }
            params.set('quality', config.quality);
            if (config.mfr) params.set('mfr', String(config.mfr));
            params.set('bitrate', String(config.bitrate));
        }

        function applyCameraFxParams(params) {
            if (appState.cameraFx === 'blur') {
                params.set('effects', '3');
                params.set('effectvalue', String(appState.cameraFxStrength));
            } else if (appState.cameraFx === 'remove') {
                params.set('effects', '16');
            } else if (appState.cameraFx === 'green') {
                params.set('effects', '4');
            } else if (appState.cameraFx === 'image') {
                params.set('effects', '5');
                if (appState.cameraBgImage) {
                    params.set('imagelist', encodeURIComponent(JSON.stringify([appState.cameraBgImage])));
                }
            }
        }

        function applyVdoTransportOverrideParams(params) {
            const names = [
                'relay',
                'private',
                'privacy',
                'tcp',
                'speedtest',
                'turn',
                'stun',
                'addstun',
                'apiserver',
                'wss',
                'wss2'
            ];
            for (let i = 0; i < names.length; i++) {
                const name = names[i];
                if (query.has(name)) {
                    params.set(name, query.get(name) || '');
                }
            }
        }

        function vdoIframeBaseUrl() {
            const candidate = String(query.get('vdoBase') || query.get('vdoUrl') || '').trim();
            if (/^https?:\/\//i.test(candidate)) {
                return candidate.replace(/[?#].*$/, '').replace(/\/?$/, '/');
            }
            // NINJam sync currently depends on VDO.Ninja alpha chunked-mode fixes.
            // Use vdoBase=https://vdo.ninja/ after those fixes are promoted.
            return 'https://vdo.ninja/alpha/';
        }

        function postEvalToVdo(source) {

            if (value === 'remove') return '16';

        function applyLiveCameraSettings(settings, changed) {
            if (!settings || typeof settings !== 'object') {
                return;
            }
            appState.cameraCodec = normalizeVdoCodec(settings.cameraCodec || appState.cameraCodec);
            appState.cameraQuality = normalizeVdoQualityPreset(settings.cameraQuality || appState.cameraQuality);
            appState.cameraFx = normalizeCameraFx(settings.cameraFx || appState.cameraFx);
            appState.cameraFxStrength = normalizeCameraFxStrength(settings.cameraFxStrength || appState.cameraFxStrength);
            appState.cameraBgImage = String(settings.cameraBgImage || '');
            appState.cameraBufferMode = normalizeCameraBufferMode(settings.cameraBufferMode || appState.cameraBufferMode);

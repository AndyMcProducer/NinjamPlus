        function buildIframeUrl() {
            const iframeParams = new URLSearchParams();
            iframeParams.set('room', appState.room);
            iframeParams.set('label', localVdoLabel());
            applyVdoCodecParams(iframeParams);
            applyVdoQualityParams(iframeParams);
            applyCameraFxParams(iframeParams);
            /*
             * VDO.Ninja sync-mode parameter contract:
             *
             * - chunked/chunkbitrate/bitrate/maxvideobitrate are video bitrate
             *   controls in kbps. They are not NINJam interval or playout-buffer
             *   durations. A previous bug sent low buffer-derived values here,
             *   which made chunked video encode at 60-120 kbps and stay blurry.
             * - chunkcodec is the chunked-video codec preference. codec is still
             *   sent too for regular VDO/RTP fallback paths, but chunked mode
             *   does not use codec by itself.
             * - buffer is only the initial VDO viewer target. NINJam owns the
             *   actual per-peer delay and sends live setBufferDelay updates once
             *   measured route/user data arrives.
             * - chunkbufferadaptive=0 keeps VDO from moving the receiver buffer
             *   behind NINJam's back. If experimenting without NINJam sync, this
             *   can be enabled with chunkbufferfloor/chunkbufferceil.
             * - chunkindex=1 and chunknack=1 opt into indexed reliability framing
             *   so skipped/missing chunks are observable and recoverable.
             * - chunkcache is a resend cache window, not the playout delay. Keep
             *   it bounded; NACKs are useful only before the receiver gives up on
             *   a frame, even when the musical/video delay is much longer.
             * - chunkedbuffer is the sender pacing/adaptation window. The sync
             *   profile tolerates short bursts before reducing quality.
             * - chunkadapt=bitrate preserves source timestamps and frame cadence.
             *   chunkadaptresolution adds 360p and emergency 180p encoder tiers,
             *   so weak links can shed pixels without moving the musical timeline.
             * - relay/tcp/speedtest/turn/stun/wss2 are optional test/deployment
             *   pass-throughs. For far TURN/TCP testing, prefer relay=<region>&tcp.
             *   speedtest=<region>&tcp can filter out all TURN entries when the
             *   speedtest endpoint only advertises UDP for that region.
             * - wss/wss2 select VDO's signaling endpoint only. Do not use the VDO
             *   handshake websocket as an app-level command/control channel.
             * - vdoBase/vdoUrl can override the VDO deployment. Until the required
             *   chunked-mode fixes are promoted, sync mode defaults to alpha.
            */
            const initialVideoBitrate = Math.max(60, appState.chunkedMs || 2500);
            const qualityConfig = vdoQualityPresetConfig(appState.cameraQuality);
            const configuredVideoCeiling = queryInteger(['chunkadaptceil'], Math.max(2500, initialVideoBitrate), 60, 100000);
            const maximumVideoBitrate = qualityConfig
                ? Math.max(configuredVideoCeiling, qualityConfig.bitrate)
                : configuredVideoCeiling;
            iframeParams.set('chunked', String(initialVideoBitrate));
            iframeParams.set('chunkbitrate', String(initialVideoBitrate));
            iframeParams.set('bitrate', String(initialVideoBitrate));
            iframeParams.set('maxvideobitrate', String(maximumVideoBitrate));
            iframeParams.set('chunkindex', query.get('chunkindex') || '1');
            iframeParams.set('chunknack', query.get('chunknack') || '1');
            iframeParams.set('chunknackattempts', String(queryInteger(['chunknackattempts'], 8, 1, 20)));
            iframeParams.set('chunknackdelay', String(queryInteger(['chunknackdelay'], 250, 50, 5000)));
            iframeParams.set('chunkchunksize', String(queryInteger(['chunkchunksize'], 4096, 2048, 65536)));
            iframeParams.set('chunkcache', String(queryInteger(['chunkcache'], 30000, 0, 60000)));
            iframeParams.set('chunkbufferadaptive', '0');
            iframeParams.set('chunkbufferfloor', '0');
            iframeParams.set('chunkbufferceil', '180000');
            iframeParams.set('chunkedbuffer', String(queryInteger(['chunkedbuffer', 'sendingbuffer'], 500, 100, 60000)));
            iframeParams.set('chunkadapt', query.get('chunkadapt') || 'bitrate');
            iframeParams.set('chunkadaptfloor', String(queryInteger(['chunkadaptfloor'], 60, 0, 10000)));
            iframeParams.set('chunkadaptceil', String(maximumVideoBitrate));
            iframeParams.set('chunkadaptthreshold', String(queryInteger(['chunkadaptthreshold'], 500, 0, 10000)));
            iframeParams.set('chunkadaptmaxdrop', String(queryInteger(['chunkadaptmaxdrop'], 0, 0, 120)));
            iframeParams.set('chunkadaptinterval', String(queryInteger(['chunkadaptinterval'], 1200, 100, 60000)));
            iframeParams.set('chunkadaptresolution', query.has('chunkadaptresolution') ? (query.get('chunkadaptresolution') || '1') : '1');
            iframeParams.set('noaudio', '1');
            iframeParams.set('buffer2', '0');
            // Keep the initial room join buffer minimal; the sync layer applies the
            // measured delay after load, and sending both can double the result.
            iframeParams.set('buffer', String(minimumBufferMs));
            if (appState.obsMode) {
                iframeParams.set('cleanoutput', '1');
                iframeParams.set('autostart', '1');
            }
            applyVdoTransportOverrideParams(iframeParams);
            return vdoIframeBaseUrl() + '?' + iframeParams.toString();
        }

        function handleVdoMessage(data) {
            if (!data || typeof data !== 'object') {
                return;
            }
            if (handleVdoPeerSyncData(data)) {
                return;
            }

            let changed = false;
            changed = handleVdoChunkEvent(data) || changed;
            changed = updateVdoChunkStats(data) || changed;

            if (data.streamIDs && typeof data.streamIDs === 'object') {
                const entries = Object.entries(data.streamIDs);
                for (let i = 0; i < entries.length; i++) {
                    const entry = entries[i];
                    changed = registerPeerTarget(entry[0], entry[1], entry[0]) || changed;
                }
            }

            if (data.action === 'guest-connected' && data.streamID) {
                const label = extractPeerLabel(data);
                const targetId = data.UUID || data.streamID;
                if (label && data.UUID) {
                    vdoState.labelByStreamId[String(data.UUID)] = label;
                }
                const targetChanged = registerPeerTarget(data.streamID, label, targetId);
                changed = targetChanged || changed;
                if (!targetChanged) {
                    const userKey = resolveUserKeyFromPeerIds(data.streamID, targetId, label);
                    requestLocalBufferRefresh(userKey, 'guestConnected');
                }
            } else if (data.action === 'push-connection' && data.streamID) {
                if (data.value === false) {
                    changed = unregisterPeerTarget(data.streamID) || changed;
                    if (data.UUID) {
                        delete vdoState.labelByStreamId[String(data.UUID)];
                    }
                } else {
                    const label = extractPeerLabel(data);
                    const targetId = data.UUID || data.streamID;
                    if (label && data.UUID) {
                        vdoState.labelByStreamId[String(data.UUID)] = label;
                    }
                    const targetChanged = registerPeerTarget(data.streamID, label, targetId);
                    changed = targetChanged || changed;
                    if (!targetChanged) {
                        const userKey = resolveUserKeyFromPeerIds(data.streamID, targetId, label);
                        requestLocalBufferRefresh(userKey, 'pushConnection');
                    }
                }
            }

            const detailedLatencyByUser = collectDetailedStateLatencyByUser(data);
            const detailedUsers = Object.keys(detailedLatencyByUser);
            let latencyChanged = false;
            for (let i = 0; i < detailedUsers.length; i++) {
                const userKey = detailedUsers[i];
                latencyChanged = setEstimatedVdoLatencyMs(userKey, detailedLatencyByUser[userKey]) || latencyChanged;
            }

            if (changed || latencyChanged) {
                applyPeerBuffers();
            } else {
                renderObsGrid();
                updateSyncStatus();
            }
        }

        window.addEventListener('message', function (event) {
            if (vdoFrame && event.source === vdoFrame.contentWindow) {
                handleVdoMessage(event.data);
                return;
            }
            if (event.origin !== window.location.origin) {
                return;
            }
            if (event.data && typeof event.data === 'object' && event.data.type === 'ninjam-vdo-camera-settings') {
                applyLiveCameraSettings(event.data.settings || {}, event.data.changed || '');
                return;
            }
            if (!event.data || typeof event.data !== 'object' || event.data.type !== 'ninjamOffsetUpdate') {
                return;
            }
            const userKey = normalizeUserId(event.data.userId || '');
            if (!userKey) {
                return;
            }
            const offsetMs = parseInt(event.data.offsetMs, 10);
            if (!isFinite(offsetMs)) {
                return;
            }
            setManualOffsetMs(userKey, offsetMs);
            if (!requestLocalBufferRefresh(userKey, 'manualOffset')) {
                applyPeerBuffers();
            }
        });

		if (vdoFrame) {
			vdoFrame.addEventListener('load', function () {
				vdoState.iframeLoaded = true;
				requestVdoRoster();
				Object.keys(vdoState.bufferApplyTimersByUser).forEach(cancelPendingBufferApply);
				vdoState.lastAppliedBufferByUser = {};
                applyPeerBuffers();
                renderObsGrid();
                if (vdoState.rosterTimerId) {
                    clearInterval(vdoState.rosterTimerId);
                }
                vdoState.rosterTimerId = setInterval(requestVdoRoster, 2500);
            });
            vdoFrame.src = buildIframeUrl();
        }

        if (appState.bg.toLowerCase() === 'green') {
            document.body.classList.add('green-mode');
        }
        if (appState.obsMode) {
            document.body.classList.add('obs-mode');
        }
        if (query.get('hideFooter') === '1') {
            document.body.classList.add('hide-footer');
        }

        roomValue.textContent = 'Room: ' + appState.room;
        labelValue.textContent = 'Label: ' + appState.label;
        updateSyncStatus();
        setInterval(renderBeatCounter, 125);
        startIntervalSource();
        setInterval(pruneInactiveUsers, 1500);
    </script>
</body>
</html>
